<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Quest: Endpoint Edition 🐍</title>
  <style>
:root {
  --bg: #0d1020;
  --bg2: #141a30;
  --panel: #171d33;
  --panel2: #1e2644;
  --ink: #e8ecf8;
  --muted: #8b93b5;
  --accent: #7c5cff;
  --accent2: #38e8c6;
  --good: #35d07f;
  --bad: #ff6b81;
  --warn: #ffcf5c;
  --line: #2a3357;
  --radius: 14px;
  font-synthesis: none;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: radial-gradient(1200px 600px at 80% -10%, #1b2448 0%, var(--bg) 55%) fixed;
  color: var(--ink);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  min-height: 100vh;
}

#confetti {
  position: fixed; inset: 0; pointer-events: none; z-index: 999;
}

/* ---------- topbar ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 20px; padding: 14px 22px;
  background: linear-gradient(90deg, var(--bg2), #10152b);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 50;
}
.brand { display: flex; align-items: center; gap: 14px; }
.logo { font-size: 34px; filter: drop-shadow(0 0 10px rgba(124,92,255,.6)); }
.title { font-size: 22px; font-weight: 800; letter-spacing: .5px;
  background: linear-gradient(90deg, var(--accent2), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.subtitle { font-size: 12.5px; color: var(--muted); }

.hud { display: flex; align-items: center; gap: 16px; }
.level-badge {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 58px; height: 58px; border-radius: 50%;
  background: conic-gradient(var(--accent), var(--accent2), var(--accent));
  color: #0d1020; font-weight: 900; box-shadow: 0 0 18px rgba(124,92,255,.5);
}
.level-badge .lv-label { font-size: 9px; letter-spacing: 1px; opacity: .8; }
.level-badge #level-num { font-size: 22px; line-height: 1; }

.xp-wrap { width: 230px; }
.xp-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.xp-bar { height: 10px; background: #0b0f1f; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.xp-bar-fill { height: 100%; width: 0; border-radius: 20px;
  background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width .6s cubic-bezier(.2,.9,.2,1); }
.xp-sub { font-size: 11px; color: var(--muted); margin-top: 3px; text-align: right; }
.muted { color: var(--muted); }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: 290px 1fr; gap: 0; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

/* ---------- sidebar ---------- */
.sidebar {
  background: var(--bg2); border-right: 1px solid var(--line);
  min-height: calc(100vh - 88px); padding: 16px 12px 40px;
  position: sticky; top: 88px; max-height: calc(100vh - 88px); overflow-y: auto;
}
.sidebar-title { font-size: 13px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin: 4px 8px 14px; }
.world { margin-bottom: 18px; }
.world-head { display: flex; align-items: center; gap: 8px; padding: 6px 8px; font-weight: 700; font-size: 14px; }
.world-emoji { font-size: 17px; }
.world-name { flex: 1; }
.world-count { font-size: 11px; color: var(--muted); background: #0e1430; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--line); }
.world-count.all { color: var(--good); border-color: var(--good); }
.badge-dot { font-size: 15px; }

.lesson-item {
  display: flex; align-items: center; gap: 9px; width: 100%;
  background: transparent; border: 1px solid transparent; color: var(--ink);
  text-align: left; padding: 9px 10px; border-radius: 10px; cursor: pointer;
  font-size: 13.5px; margin: 2px 0; transition: background .15s, border .15s;
}
.lesson-item:hover:not(:disabled) { background: var(--panel2); }
.lesson-item.active { background: linear-gradient(90deg, rgba(124,92,255,.22), rgba(56,232,198,.1)); border-color: var(--accent); }
.lesson-item.done .lesson-title { color: var(--good); }
.lesson-item.locked { opacity: .45; cursor: not-allowed; }
.lesson-item .tick { width: 18px; text-align: center; }
.lesson-item .lesson-title { flex: 1; }
.xp-chip { font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); padding: 1px 6px; border-radius: 8px; }

.py-status { margin: 18px 8px 0; font-size: 12px; color: var(--warn); padding: 8px 10px; border: 1px dashed var(--line); border-radius: 10px; transition: opacity .6s; }
.py-status.ready { color: var(--good); border-color: var(--good); }
.py-status.fade { opacity: .35; }

/* ---------- lesson panel ---------- */
.lesson-panel { padding: 26px 34px 80px; max-width: 920px; }
.lesson-crumbs { font-size: 12.5px; color: var(--muted); letter-spacing: .5px; }
.lesson-h1 { font-size: 28px; margin: 6px 0 16px; }
.lesson-xp { font-size: 13px; color: var(--accent2); font-weight: 700; vertical-align: middle; margin-left: 8px; }

.story, .concept, .task { border-radius: var(--radius); padding: 16px 18px; margin: 14px 0; line-height: 1.6; font-size: 15px; }
.story { background: linear-gradient(90deg, rgba(124,92,255,.14), transparent); border: 1px solid var(--line); }
.concept { background: var(--panel); border: 1px solid var(--line); }
.task { background: rgba(56,232,198,.08); border: 1px solid var(--accent2); }

pre { background: #0b0f1f; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto;
  font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; font-size: 13.5px; line-height: 1.55; color: #d7e0ff; }
code { font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; background: #0b0f1f; border: 1px solid var(--line);
  padding: 1px 6px; border-radius: 6px; font-size: 13px; color: var(--accent2); }
.concept pre code, pre code { background: transparent; border: none; padding: 0; color: inherit; }

/* ---------- editor ---------- */
.editor-wrap { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-top: 18px; background: #0b0f1f; }
.editor-bar { display: flex; justify-content: space-between; align-items: center; background: var(--panel2); padding: 7px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
#editor {
  width: 100%; min-height: 160px; resize: vertical; border: none; outline: none;
  background: #0b0f1f; color: #e7ecff; padding: 14px 16px;
  font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; font-size: 14px; line-height: 1.6; tab-size: 4;
}

/* ---------- buttons ---------- */
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
.btn { border: 1px solid var(--line); background: var(--panel2); color: var(--ink); padding: 10px 16px; border-radius: 10px;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: transform .08s, box-shadow .15s, background .15s; }
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.run { background: linear-gradient(90deg, #2a3570, #223); border-color: var(--accent); }
.btn.check { background: linear-gradient(90deg, var(--accent), #5a3fe0); border-color: var(--accent); box-shadow: 0 6px 18px rgba(124,92,255,.35); }
.btn.hint { background: rgba(255,207,92,.14); border-color: var(--warn); color: var(--warn); }
.btn.ghost { background: transparent; }
.btn.pulse { animation: pulse 1.1s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(56,232,198,.5); } 50% { box-shadow: 0 0 0 8px rgba(56,232,198,0); } }

.mini-btn { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 3px 9px; border-radius: 8px; font-size: 12px; cursor: pointer; }
.mini-btn:hover { color: var(--ink); }
.mini-btn.danger:hover { color: var(--bad); border-color: var(--bad); }

/* ---------- output ---------- */
.console { min-height: 44px; white-space: pre-wrap; margin: 8px 0 6px; color: #b9c6ff; }
.feedback { border-radius: 10px; padding: 0; font-size: 15px; white-space: pre-wrap; line-height: 1.5; }
.feedback.good { background: rgba(53,208,127,.12); border: 1px solid var(--good); color: #b6ffd6; padding: 14px 16px; }
.feedback.bad { background: rgba(255,107,129,.1); border: 1px solid var(--bad); color: #ffc9d1; padding: 14px 16px; }

/* ---------- hints ---------- */
.hints { margin: 6px 0; display: flex; flex-direction: column; gap: 8px; }
.hint-line { background: rgba(255,207,92,.08); border: 1px solid rgba(255,207,92,.4); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
.hint-line code { background: #0b0f1f; color: var(--warn); }
.solution-box { background: var(--panel); border: 1px solid var(--accent2); border-radius: 10px; padding: 12px 14px; }
.sol-head { font-size: 13px; color: var(--accent2); margin-bottom: 8px; font-weight: 700; }

/* ---------- footer nav ---------- */
.lesson-foot { display: flex; justify-content: space-between; margin-top: 26px; }

/* ---------- toast ---------- */
.toast {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--panel2); border: 1px solid var(--accent); color: var(--ink);
  padding: 13px 22px; border-radius: 12px; font-size: 14.5px; font-weight: 600;
  box-shadow: 0 10px 30px rgba(0,0,0,.5); opacity: 0; pointer-events: none;
  transition: opacity .3s, transform .3s; z-index: 1000; max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- live Intune portal ---------- */
.portal { margin-top: 18px; border: 1px solid var(--accent); border-radius: var(--radius); overflow: hidden; background: #0c1126; box-shadow: 0 0 24px rgba(124,92,255,.15); }
.portal-head { background: linear-gradient(90deg, rgba(124,92,255,.25), rgba(56,232,198,.12)); padding: 10px 14px; font-weight: 700; font-size: 14px; border-bottom: 1px solid var(--line); }
.portal-sub { color: var(--muted); font-weight: 400; font-size: 12px; }
.portal-body { padding: 8px; }
.portal-empty { color: var(--muted); padding: 18px; text-align: center; font-size: 13px; }

.dev-grid { display: flex; flex-direction: column; gap: 4px; }
.dev-head-row, .dev-row { display: grid; grid-template-columns: 1.4fr 1.1fr 1fr 1.4fr .9fr 1.8fr; gap: 8px; align-items: center; padding: 7px 10px; font-size: 12.5px; }
.dev-head-row { color: var(--muted); font-size: 10.5px; letter-spacing: .5px; text-transform: uppercase; border-bottom: 1px solid var(--line); }
.dev-row { background: #0e1430; border: 1px solid transparent; border-radius: 8px; transition: background .3s, border-color .3s; }
.dev-row.changed { border-color: var(--accent2); background: rgba(56,232,198,.08); animation: rowglow 1.2s ease; }
@keyframes rowglow { 0% { box-shadow: 0 0 0 0 rgba(56,232,198,.6); } 100% { box-shadow: 0 0 0 10px rgba(56,232,198,0); } }
.dev-name { font-weight: 700; display: flex; flex-direction: column; }
.dev-name i { font-style: normal; font-size: 10px; color: var(--muted); }
.dev-os small { color: var(--muted); }
.dev-comp { font-weight: 700; font-size: 11.5px; }
.dev-comp.ok { color: var(--good); }
.dev-comp.bad { color: var(--bad); }
.dev-owner, .dev-seen { color: var(--muted); font-size: 11.5px; word-break: break-all; }
.dev-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { background: #23305c; border: 1px solid var(--accent); color: #cdd6ff; font-size: 10.5px; padding: 2px 8px; border-radius: 20px; }
.chip-cat { background: rgba(255,207,92,.15); border-color: var(--warn); color: var(--warn); }
.chip-new { background: var(--accent2); color: #062; border-color: var(--accent2); animation: pop .4s ease; font-weight: 700; }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.chip-empty { color: #41507e; }

.det-head { margin: 14px 6px 8px; font-weight: 700; font-size: 13px; }
.det-grid { display: flex; flex-direction: column; gap: 4px; }
.det-row { display: grid; grid-template-columns: .7fr 1.2fr 1.6fr .8fr; gap: 8px; align-items: center; padding: 6px 10px; background: #0e1430; border: 1px solid transparent; border-radius: 8px; font-size: 12px; }
.det-row.changed { border-color: var(--accent2); animation: rowglow 1.2s ease; }
.sev { font-weight: 800; text-transform: uppercase; font-size: 10px; text-align: center; border-radius: 6px; padding: 2px 4px; }
.sev-critical { background: #ff3b5c; color: #fff; }
.sev-high { background: #ff7a45; color: #2a0f00; }
.sev-medium { background: var(--warn); color: #2a2200; }
.sev-low { background: #3a4a7a; color: #cdd6ff; }
.det-host { font-weight: 700; }
.det-tactic { color: var(--muted); }
.det-status { font-weight: 700; font-size: 11px; text-align: center; border-radius: 6px; padding: 2px 6px; }
.st-new { background: rgba(255,107,129,.15); color: var(--bad); }
.st-resolved { background: rgba(53,208,127,.15); color: var(--good); }

.portal-foot { margin-top: 10px; padding: 8px 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }

@media (max-width: 760px) {
  .dev-head-row { display: none; }
  .dev-row { grid-template-columns: 1fr 1fr; gap: 4px; }
  .det-row { grid-template-columns: .6fr 1fr; }
}

</style>

<body>
  <canvas id="confetti"></canvas>

  <header class="topbar">
    <div class="brand">
      <span class="logo">🐍</span>
      <div>
        <div class="title">Python Quest</div>
        <div class="subtitle">Endpoint Edition — learn Python by building a device tagging system</div>
      </div>
    </div>

    <div class="hud">
      <div class="level-badge">
        <span class="lv-label">LVL</span>
        <span id="level-num">1</span>
      </div>
      <div class="xp-wrap">
        <div class="xp-top">
          <span>⭐ <b id="xp-total">0</b> XP</span>
          <span id="progress-count" class="muted">0 / 35 quests</span>
        </div>
        <div class="xp-bar"><div id="xp-bar-fill" class="xp-bar-fill"></div></div>
        <div class="xp-sub"><span id="xp-into">0 / 150</span> to next level</div>
      </div>
      <button id="reset-progress" class="mini-btn danger" title="Reset all progress">reset</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-title">🗺️ Quest Map</div>
      <div id="nav"></div>
      <div id="py-status" class="py-status">Loading…</div>
    </aside>

    <main id="lesson" class="lesson-panel"></main>
  </div>

  <div id="toast" class="toast"></div>

  <script>
/* ============================================================
   SIMULATED ENVIRONMENT (runs inside Pyodide before your code)
   Gives every lesson three live objects to automate against:
     intune  -> mock Microsoft Intune device management
     graph   -> mock Microsoft Graph REST client (auth, paging)
     falcon  -> mock CrowdStrike Falcon detections
   The app reads __state__() after each run to draw the live portal.
   ============================================================ */

const ENV_PYTHON = `
import json as _json
from datetime import datetime, date, timedelta

# Fixed "today" so date math is deterministic in the simulator
NOW = date(2026, 11, 13)

def _seed_devices():
    return [
        {"id":"DEV-001","name":"LAPTOP-01","os":"Windows","osVersion":"11.0.22631","compliant":True,"managed":True,"owner":"alice@contoso.com","lastSeen":"2026-11-12","category":None,"tags":[]},
        {"id":"DEV-002","name":"MACBOOK-07","os":"macOS","osVersion":"14.5","compliant":True,"managed":True,"owner":"bob@contoso.com","lastSeen":"2026-11-10","category":None,"tags":[]},
        {"id":"DEV-003","name":"IPHONE-22","os":"iOS","osVersion":"17.5","compliant":False,"managed":True,"owner":"carol@contoso.com","lastSeen":"2026-11-13","category":None,"tags":[]},
        {"id":"DEV-004","name":"PIXEL-09","os":"Android","osVersion":"14","compliant":True,"managed":False,"owner":"dave@contoso.com","lastSeen":"2026-10-01","category":None,"tags":[]},
        {"id":"DEV-005","name":"SERVER-01","os":"Windows","osVersion":"2022","compliant":False,"managed":True,"owner":"svc-admin@contoso.com","lastSeen":"2026-09-15","category":None,"tags":[]},
        {"id":"DEV-006","name":"KIOSK-03","os":"Linux","osVersion":"Ubuntu 22.04","compliant":False,"managed":True,"owner":"ops@contoso.com","lastSeen":"2026-11-11","category":None,"tags":[]},
    ]

class _Response:
    def __init__(self, status_code, data, headers=None):
        self.status_code = status_code
        self._data = data
        self.headers = headers or {}
    def json(self):
        return self._data
    @property
    def ok(self):
        return 200 <= self.status_code < 300
    def raise_for_status(self):
        if not self.ok:
            raise Exception("HTTP " + str(self.status_code))
    def __repr__(self):
        return "<Response [" + str(self.status_code) + "]>"

class IntuneSim:
    def __init__(self):
        self.devices = _seed_devices()
        self.audit = []
    def _find(self, device_id):
        for d in self.devices:
            if d["id"] == device_id:
                return d
        return None
    def list_devices(self):
        return self.devices
    def get_device(self, device_id):
        return self._find(device_id)
    def add_tag(self, device_id, tag):
        d = self._find(device_id)
        if d is None:
            raise KeyError("No device " + str(device_id))
        if tag not in d["tags"]:
            d["tags"].append(tag)
            self.audit.append("add_tag " + device_id + " " + tag)
        return d
    def remove_tag(self, device_id, tag):
        d = self._find(device_id)
        if d is None:
            raise KeyError("No device " + str(device_id))
        if tag in d["tags"]:
            d["tags"].remove(tag)
            self.audit.append("remove_tag " + device_id + " " + tag)
        return d
    def set_category(self, device_id, category):
        d = self._find(device_id)
        if d is None:
            raise KeyError("No device " + str(device_id))
        d["category"] = category
        self.audit.append("set_category " + device_id + " " + str(category))
        return d
    def set_compliance(self, device_id, compliant):
        d = self._find(device_id)
        if d is None:
            raise KeyError("No device " + str(device_id))
        d["compliant"] = bool(compliant)
        self.audit.append("set_compliance " + device_id + " " + str(compliant))
        return d
    def offboard(self, device_id):
        d = self._find(device_id)
        if d is None:
            raise KeyError("No device " + str(device_id))
        self.devices = [x for x in self.devices if x["id"] != device_id]
        self.audit.append("offboard " + device_id)
        return True

def _to_graph(d):
    return {
        "id": d["id"],
        "deviceName": d["name"],
        "operatingSystem": d["os"],
        "osVersion": d["osVersion"],
        "complianceState": "compliant" if d["compliant"] else "noncompliant",
        "managementAgent": "mdm" if d["managed"] else "unknown",
        "userPrincipalName": d["owner"],
        "lastSyncDateTime": d["lastSeen"] + "T00:00:00Z",
    }

class GraphClient:
    PAGE = 3
    BASE = "https://graph.microsoft.com/v1.0"
    def __init__(self, intune):
        self._intune = intune
        self.token = None
        self.calls = []
        self._flaky = 0
    def authenticate(self, client_id, client_secret, tenant_id):
        if client_id and client_secret and tenant_id:
            self.token = "eyJ0.simulated-access-token.AbC"
            return self.token
        raise Exception("invalid_client: missing client_id / secret / tenant")
    def _auth_fail(self):
        return _Response(401, {"error": {"code": "InvalidAuthenticationToken", "message": "Access token is empty."}})
    def get(self, url, headers=None):
        self.calls.append(("GET", url))
        if not self.token:
            return self._auth_fail()
        if "managedDevices" in url:
            skip = 0
            if "skiptoken=" in url:
                try:
                    skip = int(url.split("skiptoken=")[1].split("&")[0])
                except Exception:
                    skip = 0
            alld = [_to_graph(d) for d in self._intune.devices]
            page = alld[skip:skip + self.PAGE]
            body = {"value": page}
            nxt = skip + self.PAGE
            if nxt < len(alld):
                body["@odata.nextLink"] = self.BASE + "/deviceManagement/managedDevices?skiptoken=" + str(nxt)
            return _Response(200, body)
        return _Response(404, {"error": {"code": "ResourceNotFound"}})
    def patch(self, url, json=None, headers=None):
        self.calls.append(("PATCH", url))
        if not self.token:
            return self._auth_fail()
        did = url.rstrip("/").split("/")[-1]
        d = self._intune.get_device(did)
        if d is None:
            return _Response(404, {"error": {"code": "ResourceNotFound"}})
        body = json or {}
        if "complianceState" in body:
            d["compliant"] = (body["complianceState"] == "compliant")
            self._intune.audit.append("patch " + did + " complianceState=" + str(body["complianceState"]))
        return _Response(204, {})
    def flaky_get(self, url):
        # A rate-limited endpoint: returns 429 twice, then 200.
        self._flaky += 1
        self.calls.append(("GET", url))
        if self._flaky < 3:
            return _Response(429, {"error": {"code": "TooManyRequests"}}, headers={"Retry-After": "1"})
        return _Response(200, {"value": [_to_graph(d) for d in self._intune.devices]})

class FalconSim:
    def __init__(self):
        self.detections = [
            {"id": "det-1", "severity": "high", "hostname": "LAPTOP-01", "tactic": "Credential Access", "status": "new"},
            {"id": "det-2", "severity": "low", "hostname": "MACBOOK-07", "tactic": "Discovery", "status": "new"},

const STORAGE_KEY = "python-quest-save-v1";

};

    state.xp = data.xp || 0;
    state.completed = data.completed || [];
    state.currentLessonId = data.currentLessonId || LESSONS[0].id;
  } catch (e) { /* ignore corrupt save */ }
}

/* ---------------- progression helpers ---------------- */
const LEVEL_SIZE = 150; // xp per level
function levelInfo() {
  const level = Math.floor(state.xp / LEVEL_SIZE) + 1;
  const into = state.xp % LEVEL_SIZE;
  return { level, into, pct: Math.round((into / LEVEL_SIZE) * 100) };
}
function lessonIndex(id) { return LESSONS.findIndex(l => l.id === id); }
function isCompleted(id) { return state.completed.includes(id); }
function isUnlocked(id) {
  const idx = lessonIndex(id);
  if (idx === 0) return true;
  return isCompleted(LESSONS[idx - 1].id); // previous lesson done
}
function worldComplete(worldId) {
  const lessons = LESSONS.filter(l => l.world === worldId);
  return lessons.length > 0 && lessons.every(l => isCompleted(l.id));
}

/* ---------------- Python runner (Pyodide) ---------------- */
async function initPython() {
  const status = document.getElementById("py-status");
  try {
    status.textContent = "Booting Python engine…";
    pyodide = await loadPyodide();
    pyReady = true;
    status.textContent = "🐍 Python ready";
    status.classList.add("ready");
    renderLesson(); // re-render to enable buttons
    // Load the seed fleet into the live portal
    const seed = await runUserCode("", "");
    if (seed.state) renderPortal(seed.state);
    setTimeout(() => status.classList.add("fade"), 1500);
  } catch (e) {
    status.textContent = "⚠️ Python failed to load (need internet / a web server)";
  }
}

function indent(src) {
  return src.split("\n").map(l => "    " + l).join("\n");
}

async function runUserCode(userCode, testCode) {
  if (!pyReady) return { passed: false, feedback: "Python is still loading…", output: "", state: null };

  // ENV_PYTHON (from env.js) builds the fresh simulated intune/graph/falcon
  // world at the top level, then user + test code run inside a try block.
  const program =
`${ENV_PYTHON}
import io, sys
_buf = io.StringIO()
_old = sys.stdout
sys.stdout = _buf
_passed = False
_feedback = ""
try:
${indent(userCode) || "    pass"}
${testCode ? indent(testCode) : "    pass"}
except Exception as _e:
    _feedback = "💥 Python error: " + str(_e)
finally:
    sys.stdout = _old
_output = _buf.getvalue()
_state_json = __state__()
`;

  const ns = pyodide.toPy({});   // fresh, isolated namespace per run
  try {
    await pyodide.runPythonAsync(program, { globals: ns });
  } catch (e) {
    ns.destroy();
    const msg = (e.message || "").trim().split("\n").slice(-3).join(" ");
    return { passed: false, feedback: "💥 Syntax error — check your code:\n" + msg, output: "", state: null };
  }
  let state = null;
  try { state = JSON.parse(ns.get("_state_json")); } catch (e) { state = null; }
  const result = {
    passed: !!ns.get("_passed"),
    feedback: ns.get("_feedback") || "",
    output: ns.get("_output") || "",
    state,
  };
  ns.destroy();
  return result;
}

/* ---------------- rendering: sidebar ---------------- */
function renderSidebar() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";

  WORLDS.forEach(world => {
    const lessons = LESSONS.filter(l => l.world === world.id);
    const done = lessons.filter(l => isCompleted(l.id)).length;

    const wEl = document.createElement("div");
    wEl.className = "world";

    const header = document.createElement("div");
    header.className = "world-head";
    header.innerHTML = `
      <span class="world-emoji">${world.emoji}</span>
      <span class="world-name">${world.name}</span>
      <span class="world-count ${done === lessons.length ? "all" : ""}">${done}/${lessons.length}</span>
      ${worldComplete(world.id) ? '<span class="badge-dot" title="World complete!">🏅</span>' : ""}
    `;
    wEl.appendChild(header);

    lessons.forEach(l => {
      const unlocked = isUnlocked(l.id);
      const completed = isCompleted(l.id);
      const item = document.createElement("button");
      item.className = "lesson-item"
        + (l.id === state.currentLessonId ? " active" : "")
        + (unlocked ? "" : " locked")
        + (completed ? " done" : "");
      item.disabled = !unlocked;
      item.innerHTML = `
        <span class="tick">${completed ? "✅" : unlocked ? "▶" : "🔒"}</span>
        <span class="lesson-title">${l.title}</span>
        <span class="xp-chip">${l.xp}xp</span>
      `;
      item.onclick = () => { state.currentLessonId = l.id; save(); render(); };
      wEl.appendChild(item);
    });

    nav.appendChild(wEl);
  });
}

/* ---------------- rendering: header / HUD ---------------- */
function renderHUD() {
  const { level, pct, into } = levelInfo();
  document.getElementById("level-num").textContent = level;
  document.getElementById("xp-total").textContent = state.xp;
  document.getElementById("xp-bar-fill").style.width = pct + "%";
  document.getElementById("xp-into").textContent = `${into} / ${LEVEL_SIZE}`;
  const doneCount = state.completed.length;
  document.getElementById("progress-count").textContent = `${doneCount} / ${LESSONS.length} quests`;
}

/* ---------------- rendering: lesson ---------------- */
let editor; // textarea element
function renderLesson() {
  const lesson = LESSONS.find(l => l.id === state.currentLessonId);
  const panel = document.getElementById("lesson");
  const world = WORLDS.find(w => w.id === lesson.world);
  const idx = lessonIndex(lesson.id);

  const shown = state.hintsShown[lesson.id] || 0;

  panel.innerHTML = `
    <div class="lesson-crumbs">${world.emoji} ${world.name} · Quest ${idx + 1} of ${LESSONS.length}</div>
    <h1 class="lesson-h1">${lesson.title} <span class="lesson-xp">+${lesson.xp} XP</span></h1>
    <div class="story">${lesson.story}</div>
    <div class="concept">${lesson.concept}</div>
    <div class="task"><b>🎯 Your mission:</b> ${lesson.task}</div>

    <div class="editor-wrap">
      <div class="editor-bar">
        <span>main.py</span>
        <button id="reset-btn" class="mini-btn" title="Reset to starter code">↺ reset</button>
      </div>
      <textarea id="editor" spellcheck="false"></textarea>
    </div>

    <div class="btn-row">
      <button id="run-btn" class="btn run" ${pyReady ? "" : "disabled"}>▶ Run</button>
      <button id="check-btn" class="btn check" ${pyReady ? "" : "disabled"}>✓ Check answer</button>
      <button id="hint-btn" class="btn hint">💡 Hint</button>
      <button id="solution-btn" class="btn ghost">👀 Show solution</button>
    </div>

    <div id="hints" class="hints"></div>
    <pre id="console" class="console"></pre>
    <div id="feedback" class="feedback"></div>

    <div class="portal">
      <div class="portal-head">🖥️ Live Intune Portal <span class="portal-sub">— updates every time you run code</span></div>
      <div id="portal-body" class="portal-body"><div class="portal-empty">Run your code to load the fleet…</div></div>
    </div>

    <div class="lesson-foot">
      <button id="prev-btn" class="btn ghost" ${idx === 0 ? "disabled" : ""}>← Previous</button>
      <button id="next-btn" class="btn ghost" ${idx === LESSONS.length - 1 ? "disabled" : ""}>Next →</button>
    </div>
  `;

  editor = document.getElementById("editor");
  editor.value = loadDraft(lesson.id) ?? lesson.starter;
  autoResize(editor);

  // Tab inserts 4 spaces; auto-save draft
  editor.addEventListener("keydown", (e) => {
    if (e.key === "Tab") {
      e.preventDefault();
      const s = editor.selectionStart, en = editor.selectionEnd;
      editor.value = editor.value.slice(0, s) + "    " + editor.value.slice(en);
      editor.selectionStart = editor.selectionEnd = s + 4;
    }
  });
  editor.addEventListener("input", () => { autoResize(editor); saveDraft(lesson.id, editor.value); });

  document.getElementById("reset-btn").onclick = () => {
    editor.value = lesson.starter; saveDraft(lesson.id, editor.value); autoResize(editor);
  };
  document.getElementById("run-btn").onclick = () => doRun(lesson, false);
  document.getElementById("check-btn").onclick = () => doRun(lesson, true);
  document.getElementById("hint-btn").onclick = () => revealHint(lesson);
  document.getElementById("solution-btn").onclick = () => showSolution(lesson);
  document.getElementById("prev-btn").onclick = () => { if (idx > 0) { state.currentLessonId = LESSONS[idx-1].id; save(); render(); } };
  document.getElementById("next-btn").onclick = () => { if (idx < LESSONS.length-1 && isUnlocked(LESSONS[idx+1].id)) { state.currentLessonId = LESSONS[idx+1].id; save(); render(); } else if (idx < LESSONS.length-1) { toast("Finish this quest to unlock the next one! 🔒"); } };

  renderHints(lesson);
  if (lastState) renderPortal(lastState);  // keep the portal visible across lessons
}

function autoResize(ta) {
  ta.style.height = "auto";
  ta.style.height = Math.max(160, ta.scrollHeight + 4) + "px";
}

/* drafts so code survives navigation */
function draftKey(id) { return "pq-draft-" + id; }
function saveDraft(id, val) { localStorage.setItem(draftKey(id), val); }
function loadDraft(id) { return localStorage.getItem(draftKey(id)); }

/* ---------------- run / check ---------------- */
async function doRun(lesson, isCheck) {
  const consoleEl = document.getElementById("console");
  const feedbackEl = document.getElementById("feedback");
  feedbackEl.className = "feedback";
  feedbackEl.textContent = "";
  consoleEl.textContent = "⏳ running…";

  const res = await runUserCode(editor.value, isCheck ? lesson.check : "");
  consoleEl.textContent = res.output ? res.output : "(no output)";
  if (res.state) renderPortal(res.state);

  if (!isCheck) {
    if (res.feedback && res.feedback.startsWith("💥")) {
      feedbackEl.textContent = res.feedback;
      feedbackEl.classList.add("bad");
    }
    return;
  }

  if (res.passed) {
    feedbackEl.textContent = "✅ " + res.feedback;
    feedbackEl.classList.add("good");
    completeLesson(lesson);
  } else {
    feedbackEl.textContent = res.feedback || "Not quite yet — tweak and try again.";
    feedbackEl.classList.add("bad");
  }
}

function completeLesson(lesson) {
  if (isCompleted(lesson.id)) {
    toast("Already cleared — nice refresher! ✨");
    return;
  }
  state.completed.push(lesson.id);
  state.xp += lesson.xp;
  save();
  confetti();

  const wasWorldDone = worldComplete(lesson.world);
  renderSidebar();
  renderHUD();

  if (wasWorldDone) {
    const w = WORLDS.find(x => x.id === lesson.world);
    toast(`🏅 World complete: ${w.name}! Badge earned.`);
  } else {
    toast(`+${lesson.xp} XP! Quest cleared 🎉`);
  }

  // auto-advance hint
  const idx = lessonIndex(lesson.id);
  if (idx < LESSONS.length - 1) {
    const nextBtn = document.getElementById("next-btn");
    if (nextBtn) { nextBtn.classList.add("pulse"); nextBtn.disabled = false; }
  } else {
    setTimeout(() => toast("🏆 You finished Python Quest! Go ace that interview."), 1200);
  }
}

/* ---------------- hints & solution ---------------- */
function revealHint(lesson) {
  const shown = state.hintsShown[lesson.id] || 0;
  if (shown >= lesson.hints.length) { toast("That's all the hints — try the solution button 👀"); return; }
  state.hintsShown[lesson.id] = shown + 1;
  renderHints(lesson);
}
function renderHints(lesson) {
  const el = document.getElementById("hints");
  if (!el) return;
  const shown = state.hintsShown[lesson.id] || 0;
  el.innerHTML = "";
  for (let i = 0; i < shown; i++) {
    const h = document.createElement("div");
    h.className = "hint-line";
    h.innerHTML = `<b>Hint ${i + 1}:</b> <code>${escapeHtml(lesson.hints[i])}</code>`;
    el.appendChild(h);
  }
}
function showSolution(lesson) {
  const el = document.getElementById("hints");
  const box = document.createElement("div");
  box.className = "solution-box";
  box.innerHTML = `<div class="sol-head">✅ One working solution (type it yourself to learn it!)</div><pre>${escapeHtml(lesson.solution)}</pre>
    <button id="use-sol" class="mini-btn">Load into editor</button>`;
  el.appendChild(box);
  document.getElementById("use-sol").onclick = () => {
    editor.value = lesson.solution; saveDraft(lesson.id, editor.value); autoResize(editor);
    toast("Loaded — now run it and read each line 📖");
  };
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ---------------- live Intune portal ---------------- */
let lastState = null;   // previous render's state (for change-glow diffing)

function renderPortal(state) {
  const body = document.getElementById("portal-body");
  if (!body || !state) return;

  const prev = lastState;
  const prevById = {};
  if (prev && prev.devices) prev.devices.forEach(d => { prevById[d.id] = d; });

  const devs = state.devices || [];
  let html = `<div class="dev-grid">
    <div class="dev-head-row">
      <span>Device</span><span>OS</span><span>Compliance</span><span>Owner</span><span>Last sync</span><span>Tags</span>
    </div>`;

  devs.forEach(d => {
    const p = prevById[d.id];
    const changed = !p || JSON.stringify(p) !== JSON.stringify(d);
    const prevTags = p ? (p.tags || []) : [];
    const cat = d.category ? `<span class="chip chip-cat">${escapeHtml(d.category)}</span>` : "";
    const chips = (d.tags && d.tags.length)
      ? d.tags.map(t => `<span class="chip ${prevTags.includes(t) ? "" : "chip-new"}">${escapeHtml(t)}</span>`).join("")
      : `<span class="chip-empty">—</span>`;
    html += `<div class="dev-row ${changed ? "changed" : ""}">
      <span class="dev-name">${escapeHtml(d.name)}<i>${escapeHtml(d.id)}</i></span>
      <span class="dev-os">${escapeHtml(d.os)} <small>${escapeHtml(d.osVersion)}</small></span>
      <span class="dev-comp ${d.compliant ? "ok" : "bad"}">${d.compliant ? "compliant" : "non-compliant"}</span>
      <span class="dev-owner">${escapeHtml(d.owner)}</span>
      <span class="dev-seen">${escapeHtml(d.lastSeen)}</span>
      <span class="dev-tags">${cat}${chips}</span>
    </div>`;
  });
  html += `</div>`;

  const dets = state.detections || [];
  if (dets.length) {
    html += `<div class="det-head">🛡️ CrowdStrike detections</div><div class="det-grid">`;
    dets.forEach(x => {
      const prevDet = prev && prev.detections ? prev.detections.find(z => z.id === x.id) : null;
      const chg = !prevDet || prevDet.status !== x.status;
      html += `<div class="det-row ${chg ? "changed" : ""}">
        <span class="sev sev-${escapeHtml(x.severity)}">${escapeHtml(x.severity)}</span>
        <span class="det-host">${escapeHtml(x.hostname)}</span>
        <span class="det-tactic">${escapeHtml(x.tactic)}</span>
        <span class="det-status st-${escapeHtml(x.status)}">${escapeHtml(x.status)}</span>
      </div>`;
    });
    html += `</div>`;
  }

  if (typeof state.graphCalls === "number") {
    html += `<div class="portal-foot">Graph API calls: <b>${state.graphCalls}</b> · Authenticated: <b>${state.authed ? "yes 🔑" : "no"}</b></div>`;
  }

  body.innerHTML = html;
  lastState = state;   // becomes "prev" for the next render
}

/* ---------------- toast + confetti ---------------- */
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

function confetti() {
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ["#7c5cff", "#38e8c6", "#ffcf5c", "#ff5c8a", "#5cc8ff"];
  const pieces = Array.from({ length: 140 }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * canvas.height * 0.5,
    r: 4 + Math.random() * 6,
    c: colors[(Math.random() * colors.length) | 0],
    vy: 2 + Math.random() * 4,
    vx: -2 + Math.random() * 4,
    rot: Math.random() * Math.PI,
    vr: -0.2 + Math.random() * 0.4,
  }));
  let frames = 0;
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r);
      ctx.restore();
    });
    frames++;
    if (frames < 140) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  tick();
}

/* ---------------- reset progress ---------------- */
function resetProgress() {
  if (!confirm("Reset ALL progress, XP and badges? This can't be undone.")) return;
  localStorage.removeItem(STORAGE_KEY);
  LESSONS.forEach(l => localStorage.removeItem(draftKey(l.id)));
  state.xp = 0; state.completed = []; state.hintsShown = {};
  state.currentLessonId = LESSONS[0].id;
  render();
  toast("Fresh start! Good luck 🍀");
}

/* ---------------- master render ---------------- */
function render() {
  renderSidebar();
  renderHUD();
  renderLesson();
}

/* ---------------- boot ---------------- */
window.addEventListener("DOMContentLoaded", () => {
  load();
  render();
  document.getElementById("reset-progress").onclick = resetProgress;
  initPython();
});

</script>
