<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Network Security Quest 🛡️</title>
  <style>
:root {
  --bg: #0b1322; --bg2: #0f1a2e; --panel: #122037; --panel2: #16263f;
  --ink: #e8f0ff; --muted: #8aa0c4; --accent: #2f8fff; --accent2: #38e8c6;
  --good: #35d07f; --bad: #ff6b81; --warn: #ffcf5c; --line: #22365c;
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: radial-gradient(1200px 600px at 80% -10%, #16284a 0%, var(--bg) 55%) fixed;
  color: var(--ink); min-height: 100vh;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
}
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 999; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 14px 22px;
  background: linear-gradient(90deg, var(--bg2), #0a1222); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 50; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo { font-size: 34px; filter: drop-shadow(0 0 10px rgba(47,143,255,.6)); }
.title { font-size: 22px; font-weight: 800; letter-spacing: .3px;
  background: linear-gradient(90deg, var(--accent2), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.subtitle { font-size: 12.5px; color: var(--muted); }
.hud { display: flex; align-items: center; gap: 16px; }
.level-badge { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 58px; height: 58px; border-radius: 50%;
  background: conic-gradient(var(--accent), var(--accent2), var(--accent)); color: #06101f; font-weight: 900; box-shadow: 0 0 18px rgba(47,143,255,.5); }
.level-badge .lv-label { font-size: 9px; letter-spacing: 1px; opacity: .8; }
.level-badge #level-num { font-size: 22px; line-height: 1; }
.xp-wrap { width: 230px; }
.xp-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.xp-bar { height: 10px; background: #081020; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.xp-bar-fill { height: 100%; width: 0; border-radius: 20px; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width .6s cubic-bezier(.2,.9,.2,1); }
.xp-sub { font-size: 11px; color: var(--muted); margin-top: 3px; text-align: right; }
.muted { color: var(--muted); }

.layout { display: grid; grid-template-columns: 290px 1fr; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
.sidebar { background: var(--bg2); border-right: 1px solid var(--line); min-height: calc(100vh - 88px); padding: 16px 12px 40px; position: sticky; top: 88px; max-height: calc(100vh - 88px); overflow-y: auto; }
.sidebar-title { font-size: 13px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin: 4px 8px 14px; }
.world { margin-bottom: 18px; }
.world-head { display: flex; align-items: center; gap: 8px; padding: 6px 8px; font-weight: 700; font-size: 14px; }
.world-emoji { font-size: 17px; } .world-name { flex: 1; }
.world-count { font-size: 11px; color: var(--muted); background: #0c1730; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--line); }
.world-count.all { color: var(--good); border-color: var(--good); }
.badge-dot { font-size: 15px; }
.lesson-item { display: flex; align-items: center; gap: 9px; width: 100%; background: transparent; border: 1px solid transparent; color: var(--ink);
  text-align: left; padding: 9px 10px; border-radius: 10px; cursor: pointer; font-size: 13.5px; margin: 2px 0; transition: background .15s, border .15s; }
.lesson-item:hover:not(:disabled) { background: var(--panel2); }
.lesson-item.active { background: linear-gradient(90deg, rgba(47,143,255,.22), rgba(56,232,198,.1)); border-color: var(--accent); }
.lesson-item.done .lesson-title { color: var(--good); }
.lesson-item.locked { opacity: .45; cursor: not-allowed; }
.lesson-item .tick { width: 18px; text-align: center; } .lesson-item .lesson-title { flex: 1; }
.xp-chip { font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); padding: 1px 6px; border-radius: 8px; }

.lesson-panel { padding: 26px 34px 80px; max-width: 900px; }
.lesson-crumbs { font-size: 12.5px; color: var(--muted); letter-spacing: .5px; }
.lesson-h1 { font-size: 28px; margin: 6px 0 16px; }
.lesson-xp { font-size: 13px; color: var(--accent2); font-weight: 700; margin-left: 8px; }
.story, .concept, .task { border-radius: var(--radius); padding: 16px 18px; margin: 14px 0; line-height: 1.6; font-size: 15px; }
.story { background: linear-gradient(90deg, rgba(47,143,255,.14), transparent); border: 1px solid var(--line); }
.concept { background: var(--panel); border: 1px solid var(--line); }
.task { background: rgba(56,232,198,.08); border: 1px solid var(--accent2); }
.concept ul { margin: 6px 0 0 18px; } .concept li { margin: 3px 0; }
pre { background: #081020; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; font-family: "JetBrains Mono", Consolas, monospace; font-size: 13.5px; line-height: 1.55; color: #cfe0ff; }
code { font-family: "JetBrains Mono", Consolas, monospace; background: #081020; border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; font-size: 13px; color: var(--accent2); }
.concept pre code, pre code { background: transparent; border: none; padding: 0; color: inherit; }

/* quiz options */
.options { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
.option { text-align: left; background: var(--panel); border: 1px solid var(--line); color: var(--ink); padding: 13px 16px; border-radius: 12px; font-size: 14.5px; cursor: pointer; transition: border .15s, background .15s, transform .08s; }
.option:hover { border-color: var(--accent); }
.option.picked { background: linear-gradient(90deg, rgba(47,143,255,.25), rgba(56,232,198,.12)); border-color: var(--accent); }

/* fill fields */
.fields { display: flex; flex-wrap: wrap; gap: 14px; margin: 16px 0; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
.field input { background: #081020; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); padding: 11px 13px; font-size: 15px; font-family: "JetBrains Mono", Consolas, monospace; width: 220px; }
.field input:focus { outline: none; border-color: var(--accent); }

/* editor */
.editor-wrap { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin: 16px 0; background: #081020; }
.editor-bar { display: flex; justify-content: space-between; align-items: center; background: var(--panel2); padding: 7px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
#editor { width: 100%; min-height: 120px; resize: vertical; border: none; outline: none; background: #081020; color: #e7f0ff; padding: 14px 16px; font-family: "JetBrains Mono", Consolas, monospace; font-size: 14px; line-height: 1.6; tab-size: 2; }

/* buttons */
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 4px; }
.btn { border: 1px solid var(--line); background: var(--panel2); color: var(--ink); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: transform .08s, box-shadow .15s; }
.btn:hover:not(:disabled) { transform: translateY(-1px); } .btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.check { background: linear-gradient(90deg, var(--accent), #1f6fe0); border-color: var(--accent); box-shadow: 0 6px 18px rgba(47,143,255,.35); }
.btn.hint { background: rgba(255,207,92,.14); border-color: var(--warn); color: var(--warn); }
.btn.ghost { background: transparent; }
.btn.pulse { animation: pulse 1.1s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(56,232,198,.5); } 50% { box-shadow: 0 0 0 8px rgba(56,232,198,0); } }
.mini-btn { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 3px 9px; border-radius: 8px; font-size: 12px; cursor: pointer; }
.mini-btn:hover { color: var(--ink); } .mini-btn.danger:hover { color: var(--bad); border-color: var(--bad); }

.feedback { border-radius: 10px; font-size: 15px; white-space: pre-wrap; line-height: 1.5; margin: 6px 0; }
.feedback.good { background: rgba(53,208,127,.12); border: 1px solid var(--good); color: #b6ffd6; padding: 14px 16px; }
.feedback.bad { background: rgba(255,107,129,.1); border: 1px solid var(--bad); color: #ffc9d1; padding: 14px 16px; }

.hints { margin: 6px 0; display: flex; flex-direction: column; gap: 8px; }
.hint-line { background: rgba(255,207,92,.08); border: 1px solid rgba(255,207,92,.4); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
.hint-line code { background: #081020; color: var(--warn); }
.solution-box { background: var(--panel); border: 1px solid var(--accent2); border-radius: 10px; padding: 12px 14px; }
.sol-head { font-size: 13px; color: var(--accent2); margin-bottom: 8px; font-weight: 700; }
.lesson-foot { display: flex; justify-content: space-between; margin-top: 26px; }

/* topology / traffic simulator */
.portal { margin-top: 18px; border: 1px solid var(--accent); border-radius: var(--radius); overflow: hidden; background: #0a1326; box-shadow: 0 0 24px rgba(47,143,255,.15); }
.portal-head { background: linear-gradient(90deg, rgba(47,143,255,.25), rgba(56,232,198,.12)); padding: 10px 14px; font-weight: 700; font-size: 14px; border-bottom: 1px solid var(--line); }
.portal-sub { color: var(--muted); font-weight: 400; font-size: 12px; }
.topo { padding: 12px; }
.zones { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.zone { font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--line); background: #0d1a34; text-transform: uppercase; letter-spacing: .5px; }
.zone-internet { border-color: #ff7a45; color: #ffb48f; }
.zone-dmz { border-color: var(--warn); color: var(--warn); }
.zone-internal { border-color: var(--accent); color: #9cc8ff; }
.zone-db { border-color: var(--accent2); color: #8ff0de; }
.zone-mgmt { border-color: #b98cff; color: #d4beff; }
.zone-attacker { border-color: var(--bad); color: #ff9fac; }
.zone-partner { border-color: #5cc8ff; color: #b5e6ff; }
.flows { display: flex; flex-direction: column; gap: 5px; }
.flow-row { display: grid; grid-template-columns: .6fr 1.5fr 1.8fr .9fr .9fr .4fr; gap: 8px; align-items: center; padding: 8px 10px; background: #0d1a34; border: 1px solid transparent; border-radius: 8px; font-size: 12.5px; transition: border-color .3s, background .3s; }
.flow-row.ok { border-color: var(--good); background: rgba(53,208,127,.08); animation: rowglow 1s ease; }
.flow-row.bad { border-color: var(--bad); background: rgba(255,107,129,.08); animation: rowglow 1s ease; }
@keyframes rowglow { 0% { box-shadow: 0 0 0 0 rgba(56,232,198,.5); } 100% { box-shadow: 0 0 0 10px rgba(56,232,198,0); } }
.flow-proto { font-weight: 700; color: var(--muted); }
.flow-path b { color: var(--ink); }
.flow-desc { color: var(--muted); }
.flow-expect { color: var(--muted); font-size: 11.5px; }
.verdict { font-weight: 800; font-size: 10.5px; text-align: center; border-radius: 6px; padding: 3px 6px; }
.verdict.allow { background: rgba(53,208,127,.18); color: var(--good); }
.verdict.deny { background: rgba(255,107,129,.18); color: var(--bad); }
.verdict.pending { background: #0d1a34; color: var(--muted); border: 1px solid var(--line); }
.flow-mark { font-weight: 900; text-align: center; }
.flow-mark.ok { color: var(--good); } .flow-mark.bad { color: var(--bad); }

.toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--panel2); border: 1px solid var(--accent); color: var(--ink);
  padding: 13px 22px; border-radius: 12px; font-size: 14.5px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; z-index: 1000; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 760px) {
  .flow-row { grid-template-columns: 1fr 1fr; }
  .field input { width: 100%; }
}

</style>

  <script>
/* ============================================================
   NETWORK SECURITY QUEST — simulation engine
   Pure logic (no DOM) so it runs in the browser AND in Node
   for the self-test. Two parts:
     1) IP / subnet math
     2) a firewall rule parser + packet evaluator
   ============================================================ */
(function (root) {

  /* ---------------- IP / subnet math ---------------- */
  function ipToInt(ip) {
    const o = String(ip).trim().split(".");
    if (o.length !== 4) return null;
    let n = 0;
    for (const part of o) {
      const v = Number(part);
      if (!Number.isInteger(v) || v < 0 || v > 255) return null;
      n = (n * 256) + v;
    }
    return n >>> 0;
  }
  function intToIp(n) {
    n = n >>> 0;
    return [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join(".");
  }
  function parseCidr(cidr) {
    const m = String(cidr).trim().match(/^(\d+\.\d+\.\d+\.\d+)\s*\/\s*(\d+)$/);
    if (!m) return null;
    const ipInt = ipToInt(m[1]);
    const bits = Number(m[2]);
    if (ipInt === null || bits < 0 || bits > 32) return null;
    const maskInt = bits === 0 ? 0 : (0xFFFFFFFF << (32 - bits)) >>> 0;
    const network = (ipInt & maskInt) >>> 0;
    const broadcast = (network | (~maskInt >>> 0)) >>> 0;
    const numAddresses = Math.pow(2, 32 - bits);
    const usableHosts = bits >= 31 ? 0 : numAddresses - 2;
    return {
      bits,
      maskInt,
      mask: intToIp(maskInt),
      network: intToIp(network),
      broadcast: intToIp(broadcast),
      firstHost: bits >= 31 ? intToIp(network) : intToIp((network + 1) >>> 0),
      lastHost: bits >= 31 ? intToIp(broadcast) : intToIp((broadcast - 1) >>> 0),
      numAddresses,
      usableHosts,
    };
  }
  // Is an IP inside a CIDR block?
  function ipInCidr(ip, cidr) {
    const info = parseCidr(cidr);
    const ipInt = ipToInt(ip);
    if (!info || ipInt === null) return false;
    const net = ipToInt(info.network);
    const bc = ipToInt(info.broadcast);
    return ipInt >= net && ipInt <= bc;
  }
  // Smallest prefix length that fits `hosts` usable hosts.
  function prefixForHosts(hosts) {
    for (let bits = 32; bits >= 0; bits--) {
      const usable = bits >= 31 ? 0 : Math.pow(2, 32 - bits) - 2;
      if (usable >= hosts) return bits;
    }
    return 0;
  }

  /* ---------------- firewall engine ---------------- */
  const ACTIONS = ["allow", "deny"];
  const PROTOS = ["tcp", "udp", "icmp", "any"];

  // Rule syntax:  action proto src dst [port]
  //   action: allow | deny
  //   proto : tcp | udp | icmp | any
  //   src/dst: zone name (e.g. internet, dmz, internal, db) or "any"
  //   port  : number or "any" (defaults to any)
  // '#' starts a comment. An optional '->' between src and dst is ignored.
  function parseRules(text) {
    const rules = [];
    const errors = [];
    String(text || "").split("\n").forEach((line, i) => {
      const noComment = line.split("#")[0];
      const raw = noComment.trim();
      if (!raw) return;
      const t = raw.split(/\s+/).filter(p => p !== "->");
      if (t.length < 4) {
        errors.push({ line: i + 1, msg: `Line ${i + 1}: need "action proto src dst [port]" — got "${raw}"` });
        return;
      }
      const action = t[0].toLowerCase();
      const proto = t[1].toLowerCase();
      const src = t[2].toLowerCase();
      const dst = t[3].toLowerCase();
      const port = (t[4] || "any").toLowerCase();
      if (!ACTIONS.includes(action)) { errors.push({ line: i + 1, msg: `Line ${i + 1}: action must be allow or deny` }); return; }
      if (!PROTOS.includes(proto)) { errors.push({ line: i + 1, msg: `Line ${i + 1}: proto must be tcp/udp/icmp/any` }); return; }
      if (port !== "any" && !/^\d+$/.test(port)) { errors.push({ line: i + 1, msg: `Line ${i + 1}: port must be a number or "any"` }); return; }
      rules.push({ action, proto, src, dst, port, raw, line: i + 1 });
    });
    return { rules, errors };
  }

  function matchFlow(rule, flow) {
    const protoOk = rule.proto === "any" || rule.proto === flow.proto;
    const srcOk = rule.src === "any" || rule.src === flow.src;
    const dstOk = rule.dst === "any" || rule.dst === flow.dst;
    const portOk = rule.port === "any" || String(rule.port) === String(flow.port);
    return protoOk && srcOk && dstOk && portOk;
  }

  // Evaluate flows top-down, first match wins, default DENY.
  function evaluate(text, flows) {
    const { rules, errors } = parseRules(text);
    const results = (flows || []).map(f => {
      let matched = null;
      for (const r of rules) { if (matchFlow(r, f)) { matched = r; break; } }
      const result = matched ? matched.action : "deny";
      return {
        flow: f,
        result,
        matchedRule: matched ? matched.raw : "(no match → default deny)",
        correct: f.expect ? result === f.expect : null,
      };
    });
    return { results, errors, rules };
  }

  const api = {
    ipToInt, intToIp, parseCidr, ipInCidr, prefixForHosts,
    parseRules, matchFlow, evaluate,
  };

  root.NetEngine = api;
  if (typeof module !== "undefined" && module.exports) module.exports = api;

})(typeof window !== "undefined" ? window : globalThis);

</script>
  <script>
/* ============================================================
   NETWORK SECURITY QUEST — curriculum
   Lesson kinds:
     "quiz"     -> options[] + answer (index)
     "fill"     -> fields[] each validated against answers[]
     "firewall" -> write rules; evaluated live against flows[]
   ============================================================ */

const WORLDS = [
  { id: "w1", name: "Net Foundations",   emoji: "🌐", blurb: "OSI, TCP/UDP, ports & masks — the vocabulary." },
  { id: "w2", name: "Subnetting",        emoji: "🧮", blurb: "CIDR math: networks, broadcasts, host counts." },
  { id: "w3", name: "Firewalls & ACLs",  emoji: "🧱", blurb: "Write rules; watch packets pass or drop live." },
  { id: "w4", name: "Segmentation",      emoji: "🔀", blurb: "Zones, zero trust & least-privilege flows." },
  { id: "w5", name: "Secure Protocols",  emoji: "🔐", blurb: "TLS, VPN/IPSec, DNS security, SSH." },
  { id: "w6", name: "Threat Detection",  emoji: "🛰️", blurb: "Scans, IDS/IPS, exfiltration & response." },
  { id: "w7", name: "Boss: Secure It",   emoji: "🏆", blurb: "Design a full, locked-down enterprise network." },
];

const LESSONS = [
  /* ================= W1: FOUNDATIONS ================= */
  {
    id: "n1", world: "w1", title: "Where IP Lives", xp: 40, kind: "quiz",
    story: `Every control you design sits on the OSI model. Know where things live.`,
    concept: `The <b>OSI model</b> has 7 layers. Key ones for security:
<ul><li>L2 Data Link — MAC addresses, switches</li>
<li>L3 Network — <b>IP addresses, routers</b></li>
<li>L4 Transport — TCP/UDP, ports</li>
<li>L7 Application — HTTP, DNS, TLS</li></ul>`,
    task: `Which OSI layer do IP addresses and routing operate at?`,
    options: ["Layer 2 (Data Link)", "Layer 3 (Network)", "Layer 4 (Transport)", "Layer 7 (Application)"],
    answer: 1,
    explanation: "IP addressing and routing are Layer 3 (Network). Switches/MACs are L2; ports are L4.",
    hints: ["Routers forward based on IP.", "It's the layer between Data Link and Transport."],
    solutionText: "Layer 3 (Network)",
  },
  {
    id: "n2", world: "w1", title: "TCP vs UDP", xp: 40, kind: "quiz",
    story: `Firewall rules and attacks both care which transport protocol is in play.`,
    concept: `<b>TCP</b> is connection-oriented (3-way handshake SYN/SYN-ACK/ACK, reliable, ordered). <b>UDP</b> is connectionless (fast, no handshake) — used by DNS, DHCP, VoIP.`,
    task: `Which statement is correct?`,
    options: [
      "UDP uses a 3-way handshake and guarantees delivery",
      "TCP is connectionless and stateless",
      "TCP is connection-oriented; UDP is connectionless",
      "Both TCP and UDP guarantee ordered delivery",
    ],
    answer: 2,
    explanation: "TCP sets up a connection (handshake, reliable, ordered). UDP is fire-and-forget.",
    hints: ["Which one does the SYN/SYN-ACK/ACK handshake?", "DNS uses the fast, connectionless one."],
    solutionText: "TCP is connection-oriented; UDP is connectionless",
  },
  {
    id: "n3", world: "w1", title: "Know Your Ports", xp: 60, kind: "fill",
    story: `Half of firewall work is knowing the well-known ports cold.`,
    concept: `Common ports: HTTP <b>80</b>, HTTPS <b>443</b>, SSH <b>22</b>, DNS <b>53</b>, RDP <b>3389</b>, SMTP <b>25</b>, MySQL <b>3306</b>.`,
    task: `Fill in the default port numbers.`,
    fields: [

  <script>
/* ============================================================
   NETWORK SECURITY QUEST — game engine
   ============================================================ */

const STORAGE_KEY = "network-quest-save-v1";

const state = {
  xp: 0,
  completed: [],
  currentLessonId: LESSONS[0].id,
  hintsShown: {},
  selected: {},   // quiz selections: lessonId -> option index
};

/* ---------------- persistence ---------------- */
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    xp: state.xp, completed: state.completed, currentLessonId: state.currentLessonId,
  }));
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    state.xp = d.xp || 0;
    state.completed = d.completed || [];
    state.currentLessonId = d.currentLessonId || LESSONS[0].id;
  } catch (e) {}
}

/* ---------------- progression ---------------- */
const LEVEL_SIZE = 200;
function levelInfo() {
  const level = Math.floor(state.xp / LEVEL_SIZE) + 1;
  const into = state.xp % LEVEL_SIZE;
  return { level, into, pct: Math.round((into / LEVEL_SIZE) * 100) };
}
function lessonIndex(id) { return LESSONS.findIndex(l => l.id === id); }
function isCompleted(id) { return state.completed.includes(id); }
function isUnlocked(id) {
  const i = lessonIndex(id);
  return i === 0 ? true : isCompleted(LESSONS[i - 1].id);
}
function worldComplete(wid) {
  const ls = LESSONS.filter(l => l.world === wid);
  return ls.length > 0 && ls.every(l => isCompleted(l.id));
}

/* ---------------- drafts ---------------- */
function draftKey(id) { return "nq-draft-" + id; }
function saveDraft(id, v) { localStorage.setItem(draftKey(id), v); }
function loadDraft(id) { return localStorage.getItem(draftKey(id)); }

/* ---------------- checking ---------------- */
function normalize(s) { return String(s).trim().toLowerCase().replace(/\s+/g, ""); }

function checkLesson(lesson) {
  if (lesson.kind === "quiz") {
    const sel = state.selected[lesson.id];
    if (sel === undefined) return { passed: false, feedback: "Pick an answer first." };
    if (sel === lesson.answer) return { passed: true, feedback: "✅ " + (lesson.explanation || "Correct!") };
    return { passed: false, feedback: "Not quite. " + "Try again, or tap a hint." };
  }

  if (lesson.kind === "fill") {
    const wrong = [];
    for (const f of lesson.fields) {
      const el = document.getElementById("field-" + f.id);
      const val = el ? normalize(el.value) : "";
      const ok = f.answers.some(a => normalize(a) === val);
      if (!ok) wrong.push(f.label);
    }
    if (wrong.length === 0) return { passed: true, feedback: "✅ All correct!" };
    return { passed: false, feedback: "Check these: " + wrong.join(", ") };
  }

  if (lesson.kind === "firewall") {
    const text = document.getElementById("editor").value;
    const { results, errors } = NetEngine.evaluate(text, lesson.flows);
    if (errors.length) {
      return { passed: false, feedback: "⚠️ " + errors[0].msg, results, errors };
    }
    const bad = results.filter(r => !r.correct);
    if (bad.length === 0) {
      return { passed: true, feedback: "✅ Every flow matches policy — nicely locked down!", results };
    }
    const b = bad[0];
    return {
      passed: false,
      results,
      feedback: `Flow "${b.flow.desc}" should be ${b.flow.expect.toUpperCase()} but your rules make it ${b.result.toUpperCase()}. (${bad.length} flow${bad.length > 1 ? "s" : ""} off.)`,
    };
  }
  return { passed: false, feedback: "Unknown lesson type." };
}

/* ---------------- rendering: sidebar + HUD ---------------- */
function renderSidebar() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  WORLDS.forEach(world => {
    const ls = LESSONS.filter(l => l.world === world.id);
    const done = ls.filter(l => isCompleted(l.id)).length;
    const wEl = document.createElement("div");
    wEl.className = "world";
    wEl.innerHTML = `<div class="world-head">
      <span class="world-emoji">${world.emoji}</span>
      <span class="world-name">${world.name}</span>
      <span class="world-count ${done === ls.length ? "all" : ""}">${done}/${ls.length}</span>
      ${worldComplete(world.id) ? '<span class="badge-dot" title="World complete!">🏅</span>' : ""}
    </div>`;
    ls.forEach(l => {
      const unlocked = isUnlocked(l.id), completed = isCompleted(l.id);
      const kindIcon = { quiz: "❓", fill: "✏️", firewall: "🧱" }[l.kind] || "▶";
      const item = document.createElement("button");
      item.className = "lesson-item" + (l.id === state.currentLessonId ? " active" : "") + (unlocked ? "" : " locked") + (completed ? " done" : "");
      item.disabled = !unlocked;
      item.innerHTML = `<span class="tick">${completed ? "✅" : unlocked ? kindIcon : "🔒"}</span>
        <span class="lesson-title">${l.title}</span><span class="xp-chip">${l.xp}</span>`;
      item.onclick = () => { state.currentLessonId = l.id; save(); render(); };
      wEl.appendChild(item);
    });
    nav.appendChild(wEl);
  });
}
function renderHUD() {
  const { level, pct, into } = levelInfo();
  document.getElementById("level-num").textContent = level;
  document.getElementById("xp-total").textContent = state.xp;
  document.getElementById("xp-bar-fill").style.width = pct + "%";
  document.getElementById("xp-into").textContent = `${into} / ${LEVEL_SIZE}`;
  document.getElementById("progress-count").textContent = `${state.completed.length} / ${LESSONS.length} quests`;
}

/* ---------------- rendering: lesson ---------------- */
function renderLesson() {
  const lesson = LESSONS.find(l => l.id === state.currentLessonId);
  const panel = document.getElementById("lesson");
  const world = WORLDS.find(w => w.id === lesson.world);
  const idx = lessonIndex(lesson.id);

  let inputHtml = "";
  if (lesson.kind === "quiz") {
    inputHtml = `<div class="options" id="options">` +
      lesson.options.map((o, i) => `<button class="option" data-i="${i}">${escapeHtml(o)}</button>`).join("") +
      `</div>`;
  } else if (lesson.kind === "fill") {
    inputHtml = `<div class="fields">` +
      lesson.fields.map(f => `<label class="field"><span>${escapeHtml(f.label)}</span>
        <input id="field-${f.id}" placeholder="${escapeHtml(f.placeholder || "")}" autocomplete="off" spellcheck="false"></label>`).join("") +
      `</div>`;
  } else if (lesson.kind === "firewall") {
    inputHtml = `<div class="editor-wrap">
        <div class="editor-bar"><span>firewall.rules</span>
          <button id="reset-btn" class="mini-btn" title="Reset">↺ reset</button></div>
        <textarea id="editor" spellcheck="false"></textarea>
      </div>`;
  }

  const primaryLabel = lesson.kind === "firewall" ? "▶ Run traffic" : "✓ Check answer";

  panel.innerHTML = `
    <div class="lesson-crumbs">${world.emoji} ${world.name} · Quest ${idx + 1}/${LESSONS.length}</div>
    <h1 class="lesson-h1">${lesson.title} <span class="lesson-xp">+${lesson.xp} XP</span></h1>
    <div class="story">${lesson.story}</div>
    <div class="concept">${lesson.concept}</div>
    <div class="task"><b>🎯 Mission:</b> ${lesson.task}</div>
    ${inputHtml}
    <div class="btn-row">
      <button id="primary-btn" class="btn check">${primaryLabel}</button>
      <button id="hint-btn" class="btn hint">💡 Hint</button>
      <button id="solution-btn" class="btn ghost">👀 Solution</button>
    </div>
    <div id="hints" class="hints"></div>
    <div id="feedback" class="feedback"></div>
    ${lesson.kind === "firewall" ? `<div class="portal">
        <div class="portal-head">🖥️ Live Traffic Simulator <span class="portal-sub">— runs your rules against each flow</span></div>
        <div id="topo" class="topo"></div>
      </div>` : ""}
    <div class="lesson-foot">
      <button id="prev-btn" class="btn ghost" ${idx === 0 ? "disabled" : ""}>← Previous</button>
      <button id="next-btn" class="btn ghost" ${idx === LESSONS.length - 1 ? "disabled" : ""}>Next →</button>
    </div>`;

  // wire inputs
  if (lesson.kind === "quiz") {
    const sel = state.selected[lesson.id];
    document.querySelectorAll(".option").forEach(btn => {
      const i = Number(btn.dataset.i);
      if (i === sel) btn.classList.add("picked");
      btn.onclick = () => {
        state.selected[lesson.id] = i;
        document.querySelectorAll(".option").forEach(b => b.classList.remove("picked"));
        btn.classList.add("picked");
      };
    });
  }
  if (lesson.kind === "firewall") {
    const ed = document.getElementById("editor");
    ed.value = loadDraft(lesson.id) ?? lesson.starter ?? "";
    autoResize(ed);
    ed.addEventListener("keydown", e => {
      if (e.key === "Tab") { e.preventDefault(); const s = ed.selectionStart; ed.value = ed.value.slice(0, s) + "  " + ed.value.slice(ed.selectionEnd); ed.selectionStart = ed.selectionEnd = s + 2; }
    });
    ed.addEventListener("input", () => { autoResize(ed); saveDraft(lesson.id, ed.value); });
    document.getElementById("reset-btn").onclick = () => { ed.value = lesson.starter ?? ""; saveDraft(lesson.id, ed.value); autoResize(ed); renderTopology(lesson, null); };
    renderTopology(lesson, null);
  }

  document.getElementById("primary-btn").onclick = () => doCheck(lesson);
  document.getElementById("hint-btn").onclick = () => revealHint(lesson);
  document.getElementById("solution-btn").onclick = () => showSolution(lesson);
  document.getElementById("prev-btn").onclick = () => { if (idx > 0) { state.currentLessonId = LESSONS[idx - 1].id; save(); render(); } };
  document.getElementById("next-btn").onclick = () => {
    if (idx < LESSONS.length - 1 && isUnlocked(LESSONS[idx + 1].id)) { state.currentLessonId = LESSONS[idx + 1].id; save(); render(); }
    else if (idx < LESSONS.length - 1) { toast("Finish this quest to unlock the next one! 🔒"); }
  };

  renderHints(lesson);
}

function autoResize(ta) { ta.style.height = "auto"; ta.style.height = Math.max(120, ta.scrollHeight + 4) + "px"; }

/* ---------------- run / check ---------------- */
function doCheck(lesson) {
  const res = checkLesson(lesson);
  const fb = document.getElementById("feedback");
  fb.className = "feedback";
  fb.textContent = res.feedback || "";
  if (lesson.kind === "firewall") renderTopology(lesson, res.results || null);

  if (res.passed) {
    fb.classList.add("good");
    completeLesson(lesson);
  } else {
    fb.classList.add("bad");
  }
}

function completeLesson(lesson) {
  if (isCompleted(lesson.id)) { toast("Already cleared — nice refresher! ✨"); return; }
  state.completed.push(lesson.id);
  state.xp += lesson.xp;
  save();
  confetti();
  const doneWorld = worldComplete(lesson.world);
  renderSidebar(); renderHUD();
  if (doneWorld) { const w = WORLDS.find(x => x.id === lesson.world); toast(`🏅 World complete: ${w.name}!`); }
  else { toast(`+${lesson.xp} XP — quest cleared! 🎉`); }
  const idx = lessonIndex(lesson.id);
  if (idx < LESSONS.length - 1) { const nb = document.getElementById("next-btn"); if (nb) { nb.classList.add("pulse"); nb.disabled = false; } }
  else { setTimeout(() => toast("🏆 You finished Network Security Quest! Go ace that interview."), 1200); }
}

/* ---------------- topology panel ---------------- */
function renderTopology(lesson, results) {
  const el = document.getElementById("topo");
  if (!el) return;
  // unique zones
  const zones = [];
  lesson.flows.forEach(f => { [f.src, f.dst].forEach(z => { if (!zones.includes(z)) zones.push(z); }); });
  const zoneHtml = `<div class="zones">` + zones.map(z => `<span class="zone zone-${z}">${escapeHtml(z)}</span>`).join("") + `</div>`;

  const rows = lesson.flows.map((f, i) => {
    const r = results ? results[i] : null;
    const actual = r ? r.result : null;
    const mark = r ? (r.correct ? "✔" : "✘") : "";
    const stateCls = r ? (r.correct ? "ok" : "bad") : "pending";
    const actualBadge = actual
      ? `<span class="verdict ${actual}">${actual.toUpperCase()}</span>`
      : `<span class="verdict pending">—</span>`;
    return `<div class="flow-row ${stateCls}">
      <span class="flow-proto">${f.proto.toUpperCase()}</span>
      <span class="flow-path"><b>${escapeHtml(f.src)}</b> → <b>${escapeHtml(f.dst)}</b>:${f.port}</span>
      <span class="flow-desc">${escapeHtml(f.desc)}</span>
      <span class="flow-expect">want <b>${f.expect}</b></span>
      ${actualBadge}
      <span class="flow-mark ${stateCls}">${mark}</span>
    </div>`;
  }).join("");

  el.innerHTML = zoneHtml + `<div class="flows">${rows}</div>`;
}

/* ---------------- hints & solution ---------------- */
function revealHint(lesson) {
  const shown = state.hintsShown[lesson.id] || 0;
  if (!lesson.hints || shown >= lesson.hints.length) { toast("That's all the hints — try the solution 👀"); return; }
  state.hintsShown[lesson.id] = shown + 1;
  renderHints(lesson);
}
function renderHints(lesson) {
  const el = document.getElementById("hints"); if (!el) return;
  const shown = state.hintsShown[lesson.id] || 0;
  el.innerHTML = "";
  for (let i = 0; i < shown; i++) {
    const h = document.createElement("div");
    h.className = "hint-line";
    h.innerHTML = `<b>Hint ${i + 1}:</b> <code>${escapeHtml(lesson.hints[i])}</code>`;
    el.appendChild(h);
  }
}
function showSolution(lesson) {
  const el = document.getElementById("hints");
  const box = document.createElement("div");
  box.className = "solution-box";
  const sol = lesson.solutionText || lesson.solution || "";
  box.innerHTML = `<div class="sol-head">✅ Answer</div><pre>${escapeHtml(sol)}</pre>` +
    (lesson.kind === "firewall" ? `<button id="use-sol" class="mini-btn">Load into editor</button>` : "");
  el.appendChild(box);
  if (lesson.kind === "firewall") {
    document.getElementById("use-sol").onclick = () => {
      const ed = document.getElementById("editor");
      ed.value = lesson.solution || sol; saveDraft(lesson.id, ed.value); autoResize(ed);
      toast("Loaded — run the traffic to see it pass 📖");
    };
  }
}

function escapeHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

/* ---------------- toast + confetti ---------------- */
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
function confetti() {
  const c = document.getElementById("confetti"), ctx = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cols = ["#7c5cff", "#38e8c6", "#ffcf5c", "#ff5c8a", "#5cc8ff"];
  const P = Array.from({ length: 130 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, r: 4 + Math.random() * 6, c: cols[(Math.random() * cols.length) | 0], vy: 2 + Math.random() * 4, vx: -2 + Math.random() * 4, rot: Math.random() * 6, vr: -.2 + Math.random() * .4 }));
  let f = 0;
  (function t() {
    ctx.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.rot += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r); ctx.restore(); });
    if (++f < 140) requestAnimationFrame(t); else ctx.clearRect(0, 0, c.width, c.height);
  })();
}

/* ---------------- reset ---------------- */
function resetProgress() {
  if (!confirm("Reset ALL progress, XP and badges?")) return;
  localStorage.removeItem(STORAGE_KEY);
  LESSONS.forEach(l => localStorage.removeItem(draftKey(l.id)));
  state.xp = 0; state.completed = []; state.hintsShown = {}; state.selected = {};
  state.currentLessonId = LESSONS[0].id;
  render(); toast("Fresh start! 🍀");
}

/* ---------------- boot ---------------- */
function render() { renderSidebar(); renderHUD(); renderLesson(); }
window.addEventListener("DOMContentLoaded", () => {
  load(); render();
  document.getElementById("reset-progress").onclick = resetProgress;
});

</script>
