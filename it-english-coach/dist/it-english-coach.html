<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT English Coach</title>
<meta name="description" content="Interactive workplace-English trainer for IT professionals: vocabulary, model sentences, drills and speaking practice.">
<meta name="theme-color" content="#4c8dff">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+CiAgPHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNyIgZmlsbD0iIzRjOGRmZiIvPgogIDxwYXRoIGQ9Ik03LjUgOS41aDE3djExLjVIMTRsLTYuNSA0LjV6IgogICAgICAgIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIyLjIiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz4KPC9zdmc+Cg==">
<style>
/* ---------------------------------- reset ---------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }

/* A declared `display` on an element beats the UA stylesheet's [hidden] rule,
   so the attribute needs to win explicitly. */
[hidden] { display: none !important; }

:root {
  --bg:        #0e1116;
  --bg-2:      #161b22;
  --bg-3:      #1d242e;
  --line:      #2a323d;
  --txt:       #e6edf3;
  --txt-dim:   #9aa7b4;
  --txt-faint: #6b7785;
  --accent:    #4c8dff;
  --accent-dim:#2a4d8f;
  --good:      #3fb950;
  --bad:       #f0646c;
  --warn:      #e3b341;
  --radius:    14px;
  --shadow:    0 6px 24px rgba(0,0,0,.35);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif;
}

body.light {
  --bg:        #f6f8fa;
  --bg-2:      #ffffff;
  --bg-3:      #eef1f5;
  --line:      #d8dee6;
  --txt:       #1c2127;
  --txt-dim:   #5a6671;
  --txt-faint: #8a949e;
  --accent:    #0b5fd4;
  --accent-dim:#b9d2f7;
  --good:      #1a7f37;
  --bad:       #cf222e;
  --warn:      #9a6700;
  --shadow:    0 6px 24px rgba(27,33,40,.10);
}

html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--txt);
  font: 16px/1.6 var(--sans);
  min-height: 100vh;
  transition: background .2s, color .2s;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
b, strong { font-weight: 650; }

/* --------------------------------- topbar --------------------------------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 16px;
  padding: 10px 20px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
.brand-mark {
  display: grid; place-items: center;
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--accent); color: #fff;
  font: 700 13px/1 var(--mono); letter-spacing: .5px;
}
.brand-text { font-weight: 650; letter-spacing: -.2px; }
@media (max-width: 560px) { .brand-text { display: none; } }

.search-wrap { position: relative; flex: 1; max-width: 520px; margin: 0 auto; }
#search {
  width: 100%; padding: 9px 14px;
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 10px; outline: none;
}
#search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.search-results {
  position: absolute; top: calc(100% + 8px); left: 0; right: 0;
  max-height: min(62vh, 480px); overflow-y: auto;
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow); padding: 6px;
}
.sr-item { display: block; width: 100%; text-align: left; padding: 9px 11px; border-radius: 8px; }
.sr-item:hover, .sr-item:focus-visible { background: var(--bg-3); outline: none; }
.sr-term { font-weight: 600; }
.sr-meta { font-size: 13px; color: var(--txt-dim); }
.sr-empty { padding: 14px; color: var(--txt-dim); font-size: 14px; }

.topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-2); display: grid; place-items: center; color: var(--txt-dim); }
.icon-btn:hover { border-color: var(--accent); }
.streak { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--txt-dim); white-space: nowrap; }
.streak b, .streak .ic { color: var(--warn); }
@media (max-width: 680px) { .streak { display: none; } }

/* ---------------------------------- layout -------------------------------- */
.view { max-width: 960px; margin: 0 auto; padding: 28px 20px 96px; }
.stack { display: flex; flex-direction: column; gap: 24px; }
h1 { font-size: clamp(24px, 4vw, 33px); line-height: 1.2; letter-spacing: -.5px; font-weight: 700; }
h2.section-title { font-size: 14px; text-transform: uppercase; letter-spacing: .9px; color: var(--txt-faint); font-weight: 650; }
.lede { color: var(--txt-dim); max-width: 62ch; }
.back { color: var(--txt-dim); font-size: 14px; align-self: flex-start; padding: 4px 0; display: flex; align-items: center; gap: 6px; }
.back:hover { color: var(--accent); }

/* ----------------------------------- hero --------------------------------- */
.hero { display: flex; flex-direction: column; gap: 16px; }
.hero h1 { max-width: 24ch; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }

.btn {
  display: inline-flex; flex-direction: column; align-items: flex-start;
  padding: 10px 18px; border-radius: 10px;
  background: var(--bg-2); border: 1px solid var(--line);
  font-weight: 600; transition: transform .08s, border-color .15s, background .15s;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn-sub { font-size: 12px; font-weight: 450; opacity: .85; }
.btn.ghost { background: transparent; }
.btn.wide { width: 100%; align-items: center; }
.btn.inline { flex-direction: row; align-items: center; gap: 8px; }

/* ------------------------------ progress strip ---------------------------- */
.progress-strip {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
  background: var(--line); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden;
}
.pm { background: var(--bg-2); padding: 14px 12px; text-align: center; }
.pm b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
.pm span { font-size: 12px; color: var(--txt-faint); }
@media (max-width: 520px) { .progress-strip { grid-template-columns: repeat(2, 1fr); } }

/* ---------------------------------- decks --------------------------------- */
.deck-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.deck-card {
  display: flex; flex-direction: column; gap: 8px;
  padding: 18px; text-align: left;
  background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius);
  transition: transform .1s, border-color .15s;
}
.deck-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.deck-card .dc-top { display: flex; align-items: center; gap: 10px; }
.deck-card .dc-icon { color: var(--accent); flex-shrink: 0; align-self: flex-start; margin-top: 2px; }
.deck-card h3 { font-size: 16px; font-weight: 650; }
.deck-card p { font-size: 13.5px; color: var(--txt-dim); flex: 1; }
.meter { height: 5px; border-radius: 99px; background: var(--bg-3); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .4s; }
.dc-foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--txt-faint); }

.deck-head { display: flex; gap: 14px; align-items: flex-start; }
.deck-icon { color: var(--accent); flex-shrink: 0; margin-top: 4px; }
.mode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 12px; }
.mode {
  display: flex; flex-direction: column; gap: 5px; padding: 15px; text-align: left;
  background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px;
  transition: border-color .15s, transform .1s;
}
.mode:hover { border-color: var(--accent); transform: translateY(-2px); }
.mode b { font-size: 15px; }
.mode span { font-size: 13px; color: var(--txt-dim); }
.deck-progress { font-size: 13.5px; color: var(--txt-dim); }

/* ---------------------------------- cards --------------------------------- */
.card {
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 22px;
  display: flex; flex-direction: column; gap: 14px;
}
.term-row { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.term { font-size: clamp(21px, 3.4vw, 27px); font-weight: 700; letter-spacing: -.4px; }
.meaning { color: var(--txt); }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .9px; color: var(--txt-faint); font-weight: 650; margin-bottom: 3px; }

.example {
  padding: 13px 15px; border-left: 3px solid var(--accent);
  background: var(--bg-3); border-radius: 0 10px 10px 0; font-size: 16.5px;
}
.block { padding: 11px 14px; border-radius: 10px; font-size: 14.5px; }
.block.avoid { background: color-mix(in srgb, var(--bad) 12%, var(--bg-2)); border: 1px solid color-mix(in srgb, var(--bad) 32%, transparent); }
.block.avoid s { color: var(--bad); text-decoration-thickness: 1px; }
.block.note  { background: var(--bg-3); border: 1px solid var(--line); color: var(--txt-dim); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; padding: 3px 9px; border-radius: 99px; background: var(--bg-3); border: 1px solid var(--line); color: var(--txt-dim); }

.say { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg-3); display: grid; place-items: center; flex-shrink: 0; }
.say:hover { border-color: var(--accent); color: var(--accent); }
.say.sm { width: 28px; height: 28px; font-size: 13px; }
.say.playing { border-color: var(--accent); color: var(--accent); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

/* ---------------------------------- drill --------------------------------- */
.drill-wrap { gap: 18px; }
.drill-top { display: flex; align-items: center; gap: 14px; }
.bar { flex: 1; height: 5px; background: var(--bg-3); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s; }
.drill-count { font-size: 13px; color: var(--txt-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }

.prompt { font-size: 13px; color: var(--txt-faint); text-transform: uppercase; letter-spacing: .9px; font-weight: 650; }
.q-text { font-size: clamp(18px, 3vw, 23px); line-height: 1.45; font-weight: 500; }
.q-text .gap { display: inline-block; min-width: 110px; border-bottom: 2px dashed var(--accent); margin: 0 4px; }

.options { display: flex; flex-direction: column; gap: 9px; }
.opt {
  text-align: left; padding: 13px 16px; border-radius: 11px;
  background: var(--bg-2); border: 1px solid var(--line);
  display: flex; gap: 11px; align-items: baseline;
  transition: border-color .12s, background .12s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .key { font: 600 12px/1.6 var(--mono); color: var(--txt-faint); min-width: 14px; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--bg-2)); }
.opt.wrong { border-color: var(--bad);  background: color-mix(in srgb, var(--bad) 14%, var(--bg-2)); }
.opt:disabled { cursor: default; }

.verdict { display: flex; flex-direction: column; gap: 12px; }
.verdict-head { font-weight: 650; display: flex; align-items: center; gap: 8px; }
.verdict-head.ok  { color: var(--good); }
.verdict-head.no  { color: var(--bad); }

.grade-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.grade { padding: 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg-2); font-weight: 600; font-size: 14.5px; }
.grade small { display: block; font-weight: 400; font-size: 11.5px; color: var(--txt-faint); }
.grade:hover { border-color: var(--accent); }

.flip-card { min-height: 190px; display: flex; flex-direction: column; justify-content: center; gap: 12px; text-align: center; align-items: center; }
.hint { color: var(--txt-faint); font-size: 13.5px; }

.summary { text-align: center; display: flex; flex-direction: column; gap: 18px; align-items: center; padding: 30px 20px; }
.summary .score { font-size: 54px; font-weight: 750; letter-spacing: -2px; line-height: 1; }
.summary .score.ok { color: var(--good); }
.summary .score.mid { color: var(--warn); }
.summary .score.no { color: var(--bad); }
.miss-list { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 8px; }
.miss { padding: 11px 14px; background: var(--bg-3); border-radius: 10px; font-size: 14.5px; border: 1px solid var(--line); }

/* -------------------------------- speaking -------------------------------- */
.mic-zone { display: flex; flex-direction: column; gap: 13px; align-items: center; text-align: center; }
.mic {
  width: 74px; height: 74px; border-radius: 50%;
  background: var(--accent); color: #fff; font-size: 27px;
  display: grid; place-items: center; border: 4px solid transparent;
}
.mic:hover { filter: brightness(1.1); }
.mic.live { animation: ring 1.2s ease-out infinite; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 100% { box-shadow: 0 0 0 22px transparent; } }
.heard { font-size: 15px; color: var(--txt-dim); min-height: 1.6em; }
.heard .hit  { color: var(--good); font-weight: 600; }
.heard .miss2 { color: var(--bad); text-decoration: underline wavy; }

.dlg-list { display: flex; flex-direction: column; gap: 14px; }
.dlg { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.dlg-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 15px 18px; text-align: left; }
.dlg-head h3 { font-size: 16px; font-weight: 650; flex: 1; }
.dlg-head .tag { font-size: 11.5px; color: var(--txt-faint); text-transform: uppercase; letter-spacing: .7px; }
.dlg-body { padding: 4px 18px 18px; display: flex; flex-direction: column; gap: 9px; }
.line { display: flex; gap: 11px; align-items: flex-start; padding: 9px 11px; border-radius: 10px; background: var(--bg-3); }
.line.you { background: color-mix(in srgb, var(--accent) 11%, var(--bg-2)); border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent); }
.line .who { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--txt-faint); min-width: 62px; padding-top: 4px; }
.line .txt { flex: 1; }
.dlg-foot { display: flex; gap: 9px; flex-wrap: wrap; padding-top: 6px; }

.notice { font-size: 13.5px; color: var(--txt-dim); background: var(--bg-3); border: 1px solid var(--line); border-left: 3px solid var(--warn); padding: 11px 14px; border-radius: 0 10px 10px 0; }

/* --------------------------------- tip card ------------------------------- */
.tip-card { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 24px; }
.tip-card h3 { font-size: 15px; font-weight: 650; margin-bottom: 10px; }
.tip-card ol { color: var(--txt-dim); font-size: 14.5px; padding-left: 20px; display: flex; flex-direction: column; gap: 7px; }
.tip-card b { color: var(--txt); }

/* ---------------------------------- icons --------------------------------- */
.ic { display: block; flex-shrink: 0; }
.dlg-chev { color: var(--txt-faint); display: flex; }
.dlg-head[aria-expanded="true"] .dlg-chev { transform: rotate(180deg); }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }
.kbd { font: 600 11px/1.5 var(--mono); padding: 2px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--bg-3); color: var(--txt-dim); }
.fade-in { animation: fade .22s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>
</head>
<body>

<header class="topbar">
  <button class="brand" id="homeBtn" title="Home">
    <span class="brand-mark">IT</span>
    <span class="brand-text">English&nbsp;Coach</span>
  </button>

  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search a phrase, e.g. blocked, deadline, doubt&hellip;" autocomplete="off" aria-label="Search phrases">
    <div id="searchResults" class="search-results" hidden></div>
  </div>

  <div class="topbar-right">
    <div class="streak" id="streak" title="Days practised in a row"></div>
    <button class="icon-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle light or dark theme"></button>
  </div>
</header>

<main id="view" class="view"></main>

<!-- ============ TEMPLATES ============ -->

<template id="tpl-home">
  <section class="stack">
    <div class="hero">
      <h1>Speak like the most articulate person in the room.</h1>
      <p class="lede">
        <strong data-count="phrases"></strong> real workplace phrases, model sentences and
        six drill modes built for software engineers, testers, analysts and support staff
        working in English every day.
      </p>
      <div class="hero-actions">
        <button class="btn primary" data-go="review">
          <span class="btn-label">Today&rsquo;s review</span>
          <span class="btn-sub" id="dueCount"></span>
        </button>
        <button class="btn" data-go="dialogues">Speaking practice</button>
      </div>
    </div>

    <div class="progress-strip">
      <div class="pm"><b id="statMastered">0</b><span>mastered</span></div>
      <div class="pm"><b id="statLearning">0</b><span>learning</span></div>
      <div class="pm"><b id="statUnseen">0</b><span>not started</span></div>
      <div class="pm"><b id="statAccuracy">&ndash;</b><span>quiz accuracy</span></div>
    </div>

    <h2 class="section-title">Choose a situation</h2>
    <div class="deck-grid" id="deckGrid"></div>

    <div class="tip-card">
      <h3>How to get the most out of this</h3>
      <ol>
        <li><b>Learn</b> a deck once, reading each sentence aloud. Hearing your own voice is the point.</li>
        <li><b>Drill</b> it with flashcards and the quiz until the phrase arrives without effort.</li>
        <li><b>Shadow</b> the dialogues &mdash; play the line, then repeat it at the same speed and rhythm.</li>
        <li>Come back to <b>Today&rsquo;s review</b> daily. Ten minutes beats a two-hour session on Sunday.</li>
      </ol>
    </div>
  </section>
</template>

<template id="tpl-deck">
  <section class="stack">
    <button class="back" data-icon="arrowL" data-go="home"><span>All situations</span></button>
    <div class="deck-head">
      <span class="deck-icon" id="deckIcon"></span>
      <div>
        <h1 id="deckName"></h1>
        <p class="lede" id="deckBlurb"></p>
      </div>
    </div>
    <div class="mode-grid">
      <button class="mode" data-mode="learn">
        <b>Learn</b><span>Read and listen to every phrase with a model sentence.</span>
      </button>
      <button class="mode" data-mode="flash">
        <b>Flashcards</b><span>See the meaning, recall the phrase. Spaced repetition.</span>
      </button>
      <button class="mode" data-mode="quiz">
        <b>Quiz</b><span>Multiple choice on meaning and usage.</span>
      </button>
      <button class="mode" data-mode="cloze">
        <b>Fill the gap</b><span>Complete a real sentence with the right phrase.</span>
      </button>
      <button class="mode" data-mode="fixit">
        <b>Spot the mistake</b><span>Choose the natural version of an awkward sentence.</span>
      </button>
      <button class="mode" data-mode="speak">
        <b>Say it</b><span>Read sentences aloud and have them checked.</span>
      </button>
    </div>
    <div class="deck-progress" id="deckProgress"></div>
  </section>
</template>

<template id="tpl-drill">
  <section class="stack drill-wrap">
    <div class="drill-top">
      <button class="back" data-icon="arrowL" id="drillExit"><span>Back</span></button>
      <div class="bar"><i id="drillBar"></i></div>
      <div class="drill-count" id="drillCount"></div>
    </div>
    <div id="drillBody"></div>
  </section>
</template>

<template id="tpl-dialogues">
  <section class="stack">
    <button class="back" data-icon="arrowL" data-go="home"><span>Home</span></button>
    <h1>Speaking practice</h1>
    <p class="lede">
      Short, realistic scripts. Play a line, then say it back at the same pace.
      Shadowing full sentences trains rhythm and stress, which is what actually makes
      speech easy to follow &mdash; more than individual sounds do.
    </p>
    <div class="dlg-list" id="dlgList"></div>
  </section>
</template>

<script>
/* ------------------------------------------------------------------
   IT English Coach — content bank
   Each item:
     term    : the phrase to learn
     meaning : plain-English definition
     example : a full, natural sentence an IT professional would say
     also    : near-equivalents you can swap in
     avoid   : the awkward/incorrect version many speakers use
     note    : register, nuance, or a usage warning
   ------------------------------------------------------------------ */

const DECKS = [
  {
    id: "standup",
    name: "Daily Standup & Status",
    icon: "bubble",
    blurb: "Report progress in fifteen seconds without rambling.",
    items: [
      {
        term: "blocked on",
        meaning: "Unable to make progress because you are waiting for something or someone.",
        example: "I'm blocked on the staging credentials \u2014 I can't verify the integration until infra provisions them.",
        also: ["held up by", "waiting on"],
        avoid: "I am in blocking. / I have a blocker from infra team.",
        note: "Blocked ON a thing, blocked BY a person's action. 'I have a blocker' is fine too."
      },
      {
        term: "wrapped up",

<script>
/* ------------------------------------------------------------------
   Progress storage — a small Leitner-box spaced repetition scheme.
   Everything lives in localStorage; nothing leaves the browser.
   ------------------------------------------------------------------ */

const Store = (() => {
  const KEY = "it-english-coach/v1";

  // Days until an item is due again, by box.
  const INTERVALS = [0, 1, 2, 4, 9, 21];
  const MAX_BOX = INTERVALS.length - 1;

  const blank = () => ({
    items: {},                 // id -> { box, due, seen, right, wrong }
    quiz: { right: 0, wrong: 0 },
    days: [],                  // ISO date strings on which the user practised
    theme: null
  });

  let state = load();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return blank();
      return Object.assign(blank(), JSON.parse(raw));
    } catch {
      return blank();
    }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { /* private mode */ }
  }

  const today = () => new Date().toISOString().slice(0, 10);

  function addDay(d) {
    if (!state.days.includes(d)) { state.days.push(d); state.days.sort(); }
  }

  function rec(id) {
    if (!state.items[id]) state.items[id] = { box: 0, due: today(), seen: 0, right: 0, wrong: 0 };
    return state.items[id];
  }

  /** Record an answer. grade: 0 = forgot, 1 = shaky, 2 = knew it. */
  function grade(id, g) {
    const r = rec(id);
    r.seen++;
    if (g >= 2)      { r.box = Math.min(MAX_BOX, r.box + 1); r.right++; }
    else if (g === 1){ r.box = Math.max(1, r.box); r.right++; }
    else             { r.box = 0; r.wrong++; }

    const d = new Date();
    d.setDate(d.getDate() + INTERVALS[r.box]);
    r.due = d.toISOString().slice(0, 10);

    addDay(today());
    save();
    return r;
  }

  function answered(id, correct) {
    state.quiz[correct ? "right" : "wrong"]++;
    grade(id, correct ? 2 : 0);
  }

  function markSeen(id) {
    const r = rec(id);
    if (r.seen === 0) r.seen = 1;
    addDay(today());
    save();
  }

  const box = id => state.items[id]?.box ?? 0;
  const isDue = id => {
    const r = state.items[id];
    if (!r) return true;                // never studied -> available
    return r.due <= today();
  };
  const mastered = id => box(id) >= 4;
  const started = id => (state.items[id]?.seen ?? 0) > 0;

  /** Consecutive days practised, counting back from today or yesterday. */
  function streak() {
    if (!state.days.length) return 0;
    const set = new Set(state.days);
    const d = new Date();
    if (!set.has(d.toISOString().slice(0, 10))) d.setDate(d.getDate() - 1);
    let n = 0;
    while (set.has(d.toISOString().slice(0, 10))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  function accuracy() {
    const { right, wrong } = state.quiz;
    const t = right + wrong;
    return t ? Math.round((right / t) * 100) : null;
  }

  function theme(v) {
    if (v === undefined) return state.theme;
    state.theme = v; save();
  }

  function reset() { state = blank(); save(); }

  return { grade, answered, markSeen, box, isDue, mastered, started, streak, accuracy, theme, reset, MAX_BOX };
})();

</script>
<script>
/* ------------------------------------------------------------------
   Speech: text-to-speech playback, and optional speech recognition
   for the "Say it" drill. Both degrade quietly where unsupported.
   ------------------------------------------------------------------ */

const Speech = (() => {
  const synth = window.speechSynthesis || null;
  let voice = null;

  function pickVoice() {
    if (!synth) return;
    const all = synth.getVoices();
    if (!all.length) return;
    // Prefer a natural-sounding English voice; fall back to any English one.
    const score = v => {
      let s = 0;
      if (/^en[-_]/i.test(v.lang)) s += 10;
      if (/^en[-_](GB|US)/i.test(v.lang)) s += 4;
      if (/natural|neural|premium|enhanced|siri|google/i.test(v.name)) s += 6;
      if (v.localService) s += 1;
      return s;
    };
    voice = all.slice().sort((a, b) => score(b) - score(a))[0] || null;
  }

  if (synth) {
    pickVoice();
    synth.addEventListener?.("voiceschanged", pickVoice);
  }

  const canSpeak = () => !!synth;

  /** Speak text. rate 0.1–2. Returns a promise that settles when finished. */
  function speak(text, { rate = 0.95, onStart, onEnd } = {}) {
    return new Promise(resolve => {
      if (!synth) { onEnd?.(); resolve(false); return; }
      synth.cancel();
      const u = new SpeechSynthesisUtterance(stripMarkers(text));
      if (voice) { u.voice = voice; u.lang = voice.lang; } else { u.lang = "en-GB"; }
      u.rate = rate;
      u.pitch = 1;
      u.onstart = () => onStart?.();
      u.onend = () => { onEnd?.(); resolve(true); };
      u.onerror = () => { onEnd?.(); resolve(false); };
      synth.speak(u);
    });
  }

  function stop() { synth?.cancel(); }

  // Em dashes and ellipses read badly in some engines.
  const stripMarkers = t => t.replace(/[\u2014\u2013]/g, ", ").replace(/\u2026/g, ".").replace(/\s+/g, " ").trim();

  /* ------------------------------ recognition ----------------------------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  const canListen = () => !!SR;
  let active = null;

  /** Listen once and resolve with the transcript (or "" on failure). */
  function listen({ onInterim, onError } = {}) {
    return new Promise(resolve => {
      if (!SR) { onError?.("unsupported"); resolve(""); return; }
      stopListening();
      const r = new SR();
      r.lang = "en-GB";
      r.interimResults = true;
      r.continuous = false;
      r.maxAlternatives = 1;

      let best = "";
      r.onresult = e => {
        let txt = "";
        for (const res of e.results) txt += res[0].transcript + " ";
        txt = txt.trim();
        if (txt) best = txt;
        onInterim?.(txt);
      };
      r.onerror = e => { onError?.(e.error); };
      r.onend = () => { active = null; resolve(best); };
      active = r;
      try { r.start(); } catch { active = null; onError?.("start-failed"); resolve(""); }
    });
  }

  function stopListening() {
    if (active) { try { active.stop(); } catch {} active = null; }
  }

  /* --------------------------- comparison helper -------------------------- */
  const norm = s => s.toLowerCase()
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/[^a-z0-9' ]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  // Contractions and spellings that should count as equal.
  const EQUIV = [
    ["im", "i am"], ["ive", "i have"], ["ill", "i will"], ["id", "i would"],
    ["youre", "you are"], ["weve", "we have"], ["were", "we are"], ["its", "it is"],
    ["dont", "do not"], ["doesnt", "does not"], ["didnt", "did not"], ["cant", "cannot"],
    ["wouldnt", "would not"], ["isnt", "is not"], ["thats", "that is"], ["lets", "let us"],
    ["optimisation", "optimization"], ["organise", "organize"], ["towards", "toward"]
  ];

  function canonical(s) {
    let t = " " + norm(s).replace(/'/g, "") + " ";
    for (const [a, b] of EQUIV) t = t.split(` ${a} `).join(` ${b} `);
    return t.trim();
  }

  /**
   * Compare a spoken attempt with the target sentence.
   * Returns { score 0-100, words: [{w, ok}] } for per-word highlighting.
   */
  function compare(target, heard) {
    const tw = canonical(target).split(" ").filter(Boolean);
    const hw = new Set(canonical(heard).split(" ").filter(Boolean));
    const SKIP = new Set(["a", "an", "the", "to", "of", "and"]);
    let hits = 0, counted = 0;
    const words = canonical(target).split(" ").filter(Boolean).map(w => {
      const ok = hw.has(w);
      if (!SKIP.has(w)) { counted++; if (ok) hits++; }
      return { w, ok };
    });
    const score = counted ? Math.round((hits / counted) * 100) : 0;
    return { score, words, total: tw.length };
  }

  return { canSpeak, speak, stop, canListen, listen, stopListening, compare };
})();

</script>
<script>
/* ------------------------------------------------------------------
   IT English Coach — views, router and drill engine
   ------------------------------------------------------------------ */

/* ------------------------------- helpers -------------------------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const view = $("#view");

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/** Clone a <template> and hydrate any [data-icon] placeholders inside it. */
function tpl(id) {
  const frag = $(`#tpl-${id}`).content.cloneNode(true);
  frag.querySelectorAll("[data-icon]").forEach(el =>
    el.insertAdjacentHTML("afterbegin", icon(el.dataset.icon, +(el.dataset.iconSize || 15))));
  return frag;
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);

/* ------------------------------ flat index ------------------------------- */
const ITEMS = [];
DECKS.forEach(d => d.items.forEach((it, i) => {
  ITEMS.push({ ...it, id: `${d.id}-${i}`, deck: d.id, deckName: d.name });
}));
const byId = new Map(ITEMS.map(i => [i.id, i]));
const deckById = new Map(DECKS.map(d => [d.id, d]));

/* --------------------------------- icons --------------------------------
   Inline SVG rather than emoji: emoji fall back to empty boxes on machines
   without a colour-emoji font, which is common on Linux desktops.
   ------------------------------------------------------------------------ */
const ICONS = {
  bubble:   '<path d="M4 5.5h16V15H10l-6 4.5z"/>',
  exchange: '<path d="M3.5 8.5h13.5"/><path d="M13.5 5l3.5 3.5-3.5 3.5"/><path d="M20.5 15.5H7"/><path d="M10.5 12L7 15.5l3.5 3.5"/>',
  search:   '<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.2 15.2L21 21"/>',
  alert:    '<path d="M12 3.5l10.5 17H1.5z"/><path d="M12 9.5v4.6"/><path d="M12 17.3h.01"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10.5h18"/><path d="M8 3v4"/><path d="M16 3v4"/>',
  users:    '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.7 2.9-5.6 6.5-5.6s6.5 1.9 6.5 5.6"/><circle cx="17.6" cy="9.6" r="2.4"/><path d="M17.2 14.3c2.6.2 4.3 2 4.3 5.2"/>',
  layers:   '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
  mail:     '<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M3.2 7.4L12 13.8l8.8-6.4"/>',
  star:     '<path d="M12 3.5l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
  pencil:   '<path d="M4 17.6L16.4 5.2a2.6 2.6 0 0 1 3.7 3.7L7.7 21.3H4z"/><path d="M13.2 8.4l3.7 3.7"/>',
  speaker:  '<path d="M11.5 4.5L6.8 8.8H3v6.4h3.8l4.7 4.3z"/><path d="M15.2 9.3a3.9 3.9 0 0 1 0 5.4"/><path d="M18 6.4a7.9 7.9 0 0 1 0 11.2"/>',
  sun:      '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.6M12 19.4V22M2 12h2.6M19.4 12H22M4.9 4.9l1.9 1.9M17.2 17.2l1.9 1.9M19.1 4.9l-1.9 1.9M6.8 17.2l-1.9 1.9"/>',
  moon:     '<path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a8.6 8.6 0 1 0 10.8 10.8z"/>',
  mic:      '<rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3.5"/>',
  flame:    '<path d="M13 2.5c.5 3 3.5 4.5 3.5 8.5a4.5 4.5 0 0 1-9 0c0-1.8.8-3 .8-3s.4 1.6 1.7 1.6c0-3.4 2-5.1 3-7.1z"/>',
  chevron:  '<path d="M6.5 9.5l5.5 5.5 5.5-5.5"/>',
  check:    '<path d="M4.5 12.8l4.8 4.7L19.5 6.5"/>',
  cross:    '<path d="M6.2 6.2l11.6 11.6"/><path d="M17.8 6.2L6.2 17.8"/>',
  arrowL:   '<path d="M19 12H5.5"/><path d="M11.5 18L5 12l6.5-6"/>',
  arrowR:   '<path d="M5 12h13.5"/><path d="M12.5 6L19 12l-6.5 6"/>'
};
const icon = (name, size = 22) =>
  `<svg class="ic" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor"
        stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] ?? ""}</svg>`;

/* ------------------------------- speak button ---------------------------- */
function sayBtn(text, cls = "say") {
  return `<button class="${cls}" data-say="${esc(text)}" title="Listen" aria-label="Listen">${icon("speaker", cls.includes("sm") ? 14 : 16)}</button>`;
}

view.addEventListener("click", e => {
  const b = e.target.closest("[data-say]");
  if (!b) return;
  $$(".say.playing").forEach(x => x.classList.remove("playing"));
  Speech.speak(b.dataset.say, {
    onStart: () => b.classList.add("playing"),
    onEnd:   () => b.classList.remove("playing")
  });
});

/* ================================ ROUTER ================================= */
function route() {
  Speech.stop();
  Speech.stopListening();
  const h = location.hash.replace(/^#\/?/, "");
  const [a, b, c] = h.split("/");

  if (a === "deck" && deckById.has(b))      renderDeck(b);
  else if (a === "drill" && b)              startDrill(b, c);
  else if (a === "dialogues")               renderDialogues();
  else if (a === "review")                  startDrill("__all", "review");
  else                                      renderHome();

  paintStreak();
  window.scrollTo({ top: 0, behavior: "instant" });
}
addEventListener("hashchange", route);

const go = path => { location.hash = "#/" + path; };

view.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) go(g.dataset.go);
});

/* ================================= HOME ================================== */
function dueItems() {
  return ITEMS.filter(i => Store.isDue(i.id) && !Store.mastered(i.id));
}

function renderHome() {
  view.replaceChildren(tpl("home"));
  view.firstElementChild.classList.add("fade-in");

  $("[data-count=phrases]").textContent = ITEMS.length;

  const mastered = ITEMS.filter(i => Store.mastered(i.id)).length;
  const started  = ITEMS.filter(i => Store.started(i.id)).length;
  $("#statMastered").textContent = mastered;
  $("#statLearning").textContent = Math.max(0, started - mastered);
  $("#statUnseen").textContent   = ITEMS.length - started;
  const acc = Store.accuracy();
  $("#statAccuracy").textContent = acc === null ? "\u2013" : acc + "%";

  const due = dueItems().length;
  $("#dueCount").textContent = due ? `${Math.min(due, 20)} phrases waiting` : "all caught up \u2014 free practice";

  const grid = $("#deckGrid");
  grid.innerHTML = DECKS.map(d => {
    const ids = d.items.map((_, i) => `${d.id}-${i}`);
    const m = ids.filter(id => Store.mastered(id)).length;
    const pct = Math.round((m / ids.length) * 100);
    return `
      <button class="deck-card" data-deck="${d.id}">
        <div class="dc-top"><span class="dc-icon">${icon(d.icon, 20)}</span><h3>${esc(d.name)}</h3></div>
        <p>${esc(d.blurb)}</p>
        <div class="meter"><i style="width:${pct}%"></i></div>
        <div class="dc-foot"><span>${ids.length} phrases</span><span>${m} mastered</span></div>
      </button>`;
  }).join("");

  grid.onclick = e => {
    const c = e.target.closest("[data-deck]");
    if (c) go("deck/" + c.dataset.deck);
  };
}

/* ================================= DECK ================================== */
function renderDeck(id) {
  const d = deckById.get(id);
  view.replaceChildren(tpl("deck"));
  view.firstElementChild.classList.add("fade-in");

  $("#deckIcon").innerHTML = icon(d.icon, 30);
  $("#deckName").textContent = d.name;
  $("#deckBlurb").textContent = d.blurb;

  const ids = d.items.map((_, i) => `${id}-${i}`);
  const m = ids.filter(x => Store.mastered(x)).length;
  const s = ids.filter(x => Store.started(x)).length;
  $("#deckProgress").innerHTML =
    `${ids.length} phrases &middot; ${s} studied &middot; <b style="color:var(--good)">${m} mastered</b>`;

  const fixable = d.items.filter(i => i.avoid).length;
  $$(".mode").forEach(btn => {
    if (btn.dataset.mode === "fixit" && fixable < 3) {
      btn.disabled = true;
      btn.style.opacity = .45;
      btn.querySelector("span").textContent = "Not enough examples in this deck.";
      return;
    }
    btn.onclick = () => go(`drill/${id}/${btn.dataset.mode}`);
  });
}

/* ============================= DRILL ENGINE ============================== */
let D = null;   // active drill session

function startDrill(deckId, mode) {
  const all = deckId === "__all" ? ITEMS : ITEMS.filter(i => i.deck === deckId);
  let queue;

  if (mode === "review") {
    const due = all.filter(i => Store.isDue(i.id));
    const pool = due.length >= 8 ? due : all;
    queue = sample(pool, Math.min(20, pool.length));
  } else if (mode === "fixit") {
    queue = shuffle(all.filter(i => i.avoid));
  } else if (mode === "learn") {
    queue = all.slice();                       // keep authored order
  } else {
    queue = shuffle(all).slice(0, 20);
  }

  if (!queue.length) { go("home"); return; }

  D = { mode, deckId, queue, i: 0, right: 0, wrong: 0, missed: [], pool: all };

  view.replaceChildren(tpl("drill"));
  view.firstElementChild.classList.add("fade-in");
  $("#drillExit").onclick = () => go(deckId === "__all" ? "home" : "deck/" + deckId);
  step();
}

function step() {
  paintStreak();                    // the first graded answer starts today's streak
  const n = D.queue.length;
  $("#drillBar").style.width = `${(D.i / n) * 100}%`;
  $("#drillCount").textContent = D.i >= n ? "done" : `${D.i + 1} / ${n}`;

  if (D.i >= n) return renderSummary();

  const item = D.queue[D.i];
  const mode = D.mode === "review" ? (Math.random() < 0.5 ? "flash" : "cloze") : D.mode;
  const body = $("#drillBody");
  body.innerHTML = "";
  body.classList.remove("fade-in"); void body.offsetWidth; body.classList.add("fade-in");

  ({ learn: viewLearn, flash: viewFlash, quiz: viewQuiz, cloze: viewCloze, fixit: viewFixit, speak: viewSpeak }[mode])(item, body);
}

function next() { D.i++; step(); }

function nextBtn(label = "Next") {
  return `<button class="btn primary wide" id="nextBtn">${label} <span class="btn-sub">press Enter</span></button>`;
}
function wireNext() {
  const b = $("#nextBtn");
  if (b) { b.onclick = next; b.focus({ preventScroll: true }); }
}

/* ------------------------------ mode: learn ----------------------------- */
function fullCard(it) {
  return `
    <div class="card">
      <div class="term-row">
        <span class="term">${esc(it.term)}</span>
        ${sayBtn(it.term)}
      </div>
      <div><div class="label">Means</div><div class="meaning">${esc(it.meaning)}</div></div>
      <div>
        <div class="label">Say it like this</div>
        <div class="row" style="align-items:flex-start">
          <div class="example" style="flex:1">${esc(it.example)}</div>
          ${sayBtn(it.example)}
        </div>
      </div>
      ${it.also ? `<div><div class="label">Also works</div><div class="chips">${it.also.map(a => `<span class="chip">${esc(a)}</span>`).join("")}</div></div>` : ""}
      ${it.avoid ? `<div class="block avoid"><div class="label">Avoid</div><s>${esc(it.avoid)}</s></div>` : ""}
      ${it.note ? `<div class="block note">${esc(it.note)}</div>` : ""}
    </div>`;
}

function viewLearn(it, body) {
  body.innerHTML = `
    <div class="stack">
      <div class="prompt">${esc(it.deckName)}</div>
      ${fullCard(it)}
      <div class="row">
        <button class="btn ghost inline" id="prevBtn" ${D.i === 0 ? "disabled style=opacity:.4" : ""}>${icon("arrowL", 16)}<span>Previous</span></button>
        <div class="spacer"></div>
        <button class="btn primary inline" id="nextBtn">${D.i === D.queue.length - 1
          ? "<span>Finish</span>"
          : `<span>Next</span>${icon("arrowR", 16)}`}</button>
      </div>
      <p class="hint">Read the example sentence out loud before you move on. Press <span class="kbd">P</span> to hear it.</p>
    </div>`;
  Store.markSeen(it.id);
  $("#prevBtn").onclick = () => { if (D.i > 0) { D.i--; step(); } };
  wireNext();
}

/* ---------------------------- mode: flashcards -------------------------- */
function viewFlash(it, body) {
  body.innerHTML = `
    <div class="stack">
      <div class="prompt">Which phrase means this?</div>
      <div class="card flip-card">
        <div class="q-text">${esc(it.meaning)}</div>
        <p class="hint">Say the phrase out loud, then reveal.</p>
        <button class="btn primary" id="revealBtn">Reveal <span class="btn-sub">space</span></button>
      </div>
    </div>`;

  $("#revealBtn").onclick = () => {
    body.innerHTML = `
      <div class="stack">
        <div class="prompt">Answer</div>
        <div class="card">
          <div class="term-row"><span class="term">${esc(it.term)}</span>${sayBtn(it.term)}</div>
          <div class="row" style="align-items:flex-start">
            <div class="example" style="flex:1">${esc(it.example)}</div>
            ${sayBtn(it.example)}
          </div>
          ${it.note ? `<div class="block note">${esc(it.note)}</div>` : ""}
        </div>
        <div class="prompt">How did that go?</div>
        <div class="grade-row">
          <button class="grade" data-g="0">No idea<small>show again today</small></button>
          <button class="grade" data-g="1">Shaky<small>show tomorrow</small></button>
          <button class="grade" data-g="2">Knew it<small>push it back</small></button>
        </div>
      </div>`;
    $$(".grade").forEach(g => g.onclick = () => {
      Store.grade(it.id, +g.dataset.g);
      if (+g.dataset.g === 0) { D.wrong++; D.missed.push(it); } else D.right++;
      next();
    });
  };
}

/* ------------------------------- mode: quiz ----------------------------- */
function distractors(it, key, n = 3) {
  const pool = D.pool.filter(x => x.id !== it.id && x[key] && x[key] !== it[key]);
  const near = pool.filter(x => x.deck === it.deck);
  const picks = sample(near.length >= n ? near : pool, n);
  return picks;
}

function askOptions(body, { prompt, question, options, correctIdx, after }) {
  body.innerHTML = `
    <div class="stack">
      <div class="prompt">${prompt}</div>
      <div class="card"><div class="q-text">${question}</div></div>
      <div class="options">
        ${options.map((o, i) => `<button class="opt" data-i="${i}"><span class="key">${i + 1}</span><span>${o}</span></button>`).join("")}
      </div>
      <div id="verdict"></div>
    </div>`;

  const opts = $$(".opt", body);
  opts.forEach(b => b.onclick = () => {
    const chosen = +b.dataset.i;
    const ok = chosen === correctIdx;
    opts.forEach((x, i) => {
      x.disabled = true;
      if (i === correctIdx) x.classList.add("right");
      else if (i === chosen) x.classList.add("wrong");
    });
    after(ok);
  });
}

function verdict(ok, it, extra = "") {
  $("#verdict").innerHTML = `
    <div class="card verdict">
      <div class="verdict-head ${ok ? "ok" : "no"}">${icon(ok ? "check" : "cross", 18)}<span>${ok ? "Correct" : "Not quite"}</span></div>
      <div class="row" style="align-items:flex-start">
        <div class="example" style="flex:1">${esc(it.example)}</div>
        ${sayBtn(it.example)}
      </div>
      ${extra}
      ${it.note ? `<div class="block note">${esc(it.note)}</div>` : ""}
      ${nextBtn(D.i === D.queue.length - 1 ? "See results" : "Next")}
    </div>`;
  wireNext();
}

function viewQuiz(it, body) {
  const opts = shuffle([it, ...distractors(it, "term")]);
  askOptions(body, {
    prompt: "Choose the phrase",
    question: esc(it.meaning),
    options: opts.map(o => `<b>${esc(o.term)}</b>`),
    correctIdx: opts.indexOf(it),
    after: ok => {
      Store.answered(it.id, ok);
      ok ? D.right++ : (D.wrong++, D.missed.push(it));
      verdict(ok, it, `<div><div class="label">Means</div>${esc(it.meaning)}</div>`);
    }
  });
}

/* ------------------------------ mode: cloze ----------------------------- */
function blankOut(sentence, term) {
  const i = sentence.toLowerCase().indexOf(term.toLowerCase());
  if (i === -1) return null;
  return esc(sentence.slice(0, i)) + `<span class="gap">&nbsp;</span>` + esc(sentence.slice(i + term.length));
}

function viewCloze(it, body) {
  const gapped = blankOut(it.example, it.term);
  if (!gapped) return viewQuiz(it, body);          // term not literal in sentence

  const opts = shuffle([it, ...distractors(it, "term")]);
  askOptions(body, {
    prompt: "Complete the sentence",
    question: gapped,
    options: opts.map(o => `<b>${esc(o.term)}</b>`),
    correctIdx: opts.indexOf(it),
    after: ok => {
      Store.answered(it.id, ok);
      ok ? D.right++ : (D.wrong++, D.missed.push(it));
      verdict(ok, it, `<div><div class="label">${esc(it.term)}</div>${esc(it.meaning)}</div>`);
    }
  });
}

/* ------------------------------ mode: fix it ---------------------------- */
function viewFixit(it, body) {
  // Options: this item's natural sentence against three awkward ones from other items.
  const choices = shuffle([
    { text: it.example, ok: true },
    ...sample(D.pool.filter(x => x.id !== it.id && x.avoid), 3).map(x => ({ text: x.avoid, ok: false }))
  ]);

  askOptions(body, {
    prompt: "Which sentence sounds natural at work?",
    question: `Instead of &ldquo;<s style="color:var(--bad)">${esc(it.avoid)}</s>&rdquo; &mdash; what would a fluent colleague say?`,
    options: choices.map(c => esc(c.text)),
    correctIdx: choices.findIndex(c => c.ok),
    after: ok => {
      Store.answered(it.id, ok);
      ok ? D.right++ : (D.wrong++, D.missed.push(it));
      verdict(ok, it, `<div><div class="label">Use</div><b>${esc(it.term)}</b> &mdash; ${esc(it.meaning)}</div>`);
    }
  });
}

/* ------------------------------ mode: say it ---------------------------- */
function viewSpeak(it, body) {
  const target = it.example;
  const canListen = Speech.canListen();

  body.innerHTML = `
    <div class="stack">
      <div class="prompt">Say this sentence</div>
      <div class="card">
        <div class="row" style="align-items:flex-start">
          <div class="example" style="flex:1;font-size:19px">${esc(target)}</div>
          ${sayBtn(target)}
        </div>
        <p class="hint">Listen first, then copy the rhythm. Press <span class="kbd">P</span> to replay, <span class="kbd">0.7&times;</span> for slow.</p>
        <div class="row">
          <button class="btn ghost" id="slowBtn">Play slowly</button>
          <div class="spacer"></div>
        </div>
      </div>

      ${canListen ? `
        <div class="card mic-zone">
          <button class="mic" id="micBtn" title="Record" aria-label="Record">${icon("mic", 30)}</button>
          <div class="heard" id="heard">Tap the microphone and read the sentence aloud.</div>
          <div id="scoreBox"></div>
        </div>` : `
        <div class="notice">
          Your browser can&rsquo;t check pronunciation (speech recognition isn&rsquo;t available here &mdash;
          Chrome or Edge on desktop usually works). Keep going anyway: listen, repeat aloud twice,
          then mark how it felt.
        </div>`}

      <div class="prompt">How comfortable was that?</div>
      <div class="grade-row">
        <button class="grade" data-g="0">Struggled<small>repeat soon</small></button>
        <button class="grade" data-g="1">Okay<small>come back tomorrow</small></button>
        <button class="grade" data-g="2">Fluent<small>push it back</small></button>
      </div>
    </div>`;

  $("#slowBtn").onclick = () => Speech.speak(target, { rate: 0.7 });

  if (canListen) {
    const mic = $("#micBtn"), heard = $("#heard"), scoreBox = $("#scoreBox");
    let listening = false;
    mic.onclick = async () => {
      if (listening) { Speech.stopListening(); return; }
      listening = true;
      mic.classList.add("live");
      heard.textContent = "Listening\u2026";
      scoreBox.innerHTML = "";
      const said = await Speech.listen({
        onInterim: t => { heard.textContent = t || "Listening\u2026"; },
        onError: err => { heard.textContent = err === "not-allowed" ? "Microphone access was blocked." : "Didn\u2019t catch that \u2014 try again."; }
      });
      listening = false;
      mic.classList.remove("live");
      if (!said) return;
      const r = Speech.compare(target, said);
      heard.innerHTML = r.words.map(w => `<span class="${w.ok ? "hit" : "miss2"}">${esc(w.w)}</span>`).join(" ");
      const colour = r.score >= 85 ? "var(--good)" : r.score >= 60 ? "var(--warn)" : "var(--bad)";
      scoreBox.innerHTML =
        `<div style="font-size:30px;font-weight:700;color:${colour}">${r.score}%</div>
         <div class="hint">${r.score >= 85 ? "Clear and accurate." : r.score >= 60 ? "Close \u2014 the underlined words didn\u2019t come through." : "Slow down and try again, one clause at a time."}</div>`;
    };
  }

  $$(".grade").forEach(g => g.onclick = () => {
    Store.grade(it.id, +g.dataset.g);
    +g.dataset.g === 0 ? (D.wrong++, D.missed.push(it)) : D.right++;
    next();
  });
}

/* ------------------------------- summary -------------------------------- */
function renderSummary() {
  const total = D.right + D.wrong;
  const pct = total ? Math.round((D.right / total) * 100) : 0;
  const band = pct >= 80 ? "ok" : pct >= 50 ? "mid" : "no";
  const msg = pct >= 80 ? "Strong. These are becoming automatic."
            : pct >= 50 ? "Solid progress. The misses below are worth a second pass."
            : "Early days. Run the Learn mode once more, reading each sentence aloud.";

  $("#drillBar").style.width = "100%";
  $("#drillBody").innerHTML = `
    <div class="card summary fade-in">
      <div class="score ${band}">${pct}%</div>
      <div><b>${D.right} of ${total}</b> confident</div>
      <p class="lede" style="text-align:center">${msg}</p>
      ${D.missed.length ? `
        <div class="miss-list">
          <div class="label">Worth another look</div>
          ${[...new Set(D.missed)].map(m => `<div class="miss"><b>${esc(m.term)}</b> &mdash; ${esc(m.meaning)}</div>`).join("")}
        </div>` : ""}
      <div class="row" style="justify-content:center">
        <button class="btn primary" id="againBtn">Run it again</button>
        <button class="btn" id="doneBtn">${D.deckId === "__all" ? "Home" : "Back to deck"}</button>
      </div>
    </div>`;

  const back = D.deckId === "__all" ? "home" : "deck/" + D.deckId;
  $("#doneBtn").onclick = () => go(back);
  $("#againBtn").onclick = () => startDrill(D.deckId, D.mode);
}

/* ============================== DIALOGUES ================================ */
function renderDialogues() {
  view.replaceChildren(tpl("dialogues"));
  view.firstElementChild.classList.add("fade-in");

  $("#dlgList").innerHTML = DIALOGUES.map(d => `
    <div class="dlg" data-dlg="${d.id}">
      <button class="dlg-head" aria-expanded="false">
        <h3>${esc(d.title)}</h3>
        <span class="tag">${esc(deckById.get(d.deck)?.name ?? "")}</span>
        <span class="dlg-chev">${icon("chevron", 18)}</span>
      </button>
      <div class="dlg-body" hidden>
        ${d.lines.map((l, i) => `
          <div class="line ${l.who === "You" ? "you" : ""}">
            <span class="who">${esc(l.who)}</span>
            <span class="txt">${esc(l.text)}</span>
            ${sayBtn(l.text, "say sm")}
          </div>`).join("")}
        <div class="dlg-foot">
          <button class="btn ghost" data-play="${d.id}">Play the whole script</button>
          <button class="btn ghost" data-mine="${d.id}">Play only my lines</button>
        </div>
      </div>
    </div>`).join("");

  $("#dlgList").addEventListener("click", async e => {
    const head = e.target.closest(".dlg-head");
    if (head) {
      const body = head.nextElementSibling;
      body.hidden = !body.hidden;
      head.setAttribute("aria-expanded", String(!body.hidden));
      return;
    }
    const play = e.target.closest("[data-play]");
    const mine = e.target.closest("[data-mine]");
    if (!play && !mine) return;
    const id = (play || mine).dataset.play || (play || mine).dataset.mine;
    const d = DIALOGUES.find(x => x.id === id);
    const lines = mine ? d.lines.filter(l => l.who === "You") : d.lines;
    const btn = play || mine;
    const label = btn.textContent;
    btn.textContent = "Playing\u2026 (click to stop)";
    let stopped = false;
    const stop = () => { stopped = true; Speech.stop(); };
    btn.addEventListener("click", stop, { once: true });
    for (const l of lines) {
      if (stopped) break;
      await Speech.speak(l.text, { rate: 0.95 });
      await new Promise(r => setTimeout(r, mine ? 1200 : 450));
    }
    btn.textContent = label;
    btn.removeEventListener("click", stop);
  });
}

/* =============================== SEARCH ================================== */
const searchBox = $("#search");
const searchOut = $("#searchResults");

function runSearch(q) {
  q = q.trim().toLowerCase();
  if (q.length < 2) { searchOut.hidden = true; return; }

  const hits = ITEMS.map(it => {
    const t = it.term.toLowerCase();
    let s = 0;
    if (t === q) s = 100;
    else if (t.startsWith(q)) s = 60;
    else if (t.includes(q)) s = 45;
    if (it.avoid?.toLowerCase().includes(q)) s = Math.max(s, 50);
    if (it.meaning.toLowerCase().includes(q)) s = Math.max(s, 25);
    if (it.example.toLowerCase().includes(q)) s = Math.max(s, 18);
    if (it.also?.some(a => a.toLowerCase().includes(q))) s = Math.max(s, 30);
    return { it, s };
  }).filter(h => h.s > 0).sort((a, b) => b.s - a.s).slice(0, 12);

  searchOut.hidden = false;
  searchOut.innerHTML = hits.length
    ? hits.map(h => `
        <button class="sr-item" data-id="${h.it.id}">
          <div class="sr-term">${esc(h.it.term)}</div>
          <div class="sr-meta">${esc(h.it.deckName)} &middot; ${esc(h.it.meaning)}</div>
        </button>`).join("")
    : `<div class="sr-empty">Nothing for &ldquo;${esc(q)}&rdquo;. Try a plainer word \u2014 <em>deadline</em>, <em>blocked</em>, <em>doubt</em>, <em>sorry</em>.</div>`;
}

let sTimer;
searchBox.addEventListener("input", () => { clearTimeout(sTimer); sTimer = setTimeout(() => runSearch(searchBox.value), 110); });
searchBox.addEventListener("focus", () => { if (searchBox.value.trim().length >= 2) runSearch(searchBox.value); });

searchOut.addEventListener("click", e => {
  const b = e.target.closest("[data-id]");
  if (!b) return;
  showItem(byId.get(b.dataset.id));
  searchOut.hidden = true;
  searchBox.blur();
});

document.addEventListener("click", e => {
  if (!e.target.closest(".search-wrap")) searchOut.hidden = true;
});

function showItem(it) {
  view.innerHTML = `
    <section class="stack fade-in">
      <button class="back" data-go="deck/${it.deck}">${icon("arrowL", 15)}<span>${esc(it.deckName)}</span></button>
      ${fullCard(it)}
      <div class="row">
        <button class="btn primary" data-go="drill/${it.deck}/learn">Study this deck</button>
        <button class="btn" data-go="home">Home</button>
      </div>
    </section>`;
}

/* ============================== CHROME ================================== */
$("#homeBtn").onclick = () => go("home");

function paintStreak() {
  const n = Store.streak();
  $("#streak").innerHTML = n ? `${icon("flame", 15)}<b>${n}</b> day${n > 1 ? "s" : ""} in a row` : "";
}

const themeBtn = $("#themeBtn");
function applyTheme(t) {
  document.body.classList.toggle("light", t === "light");
  themeBtn.innerHTML = icon(t === "light" ? "moon" : "sun", 17);
  themeBtn.title = t === "light" ? "Switch to dark" : "Switch to light";
}
const prefersLight = () => !!window.matchMedia?.("(prefers-color-scheme: light)").matches;
applyTheme(Store.theme() ?? (prefersLight() ? "light" : "dark"));
themeBtn.onclick = () => {
  const t = document.body.classList.contains("light") ? "dark" : "light";
  Store.theme(t); applyTheme(t);
};

/* ----------------------------- keyboard --------------------------------- */
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") {
    if (e.key === "Escape") { e.target.value = ""; searchOut.hidden = true; e.target.blur(); }
    return;
  }
  if (e.key === "/") { e.preventDefault(); searchBox.focus(); return; }

  const reveal = $("#revealBtn");
  const nb = $("#nextBtn");
  const opts = $$(".opt:not(:disabled)");

  if (e.key === " " && reveal) { e.preventDefault(); reveal.click(); return; }
  if (e.key === "Enter" && nb) { e.preventDefault(); nb.click(); return; }
  if (/^[1-4]$/.test(e.key) && opts.length) { e.preventDefault(); opts[+e.key - 1]?.click(); return; }
  if (/^[1-3]$/.test(e.key)) { const g = $$(".grade")[+e.key - 1]; if (g) { e.preventDefault(); g.click(); return; } }
  if (e.key.toLowerCase() === "p") {
    const say = $$("[data-say]").pop();
    if (say) { e.preventDefault(); say.click(); }
  }
});

/* ------------------------------- boot ----------------------------------- */
route();

</script>
